name: Release
# Ein Tag `v*` löst aus: Windows-Bau (windows-build.yml, mit MSI-Upgrade-Probe) und Linux-Bau
# (linux-build.yml: AppImage, Flatpak) laufen nebeneinander, dann prüfen, signieren, `latest.json` und
# `SHA256SUMS` schreiben und ein Release als ENTWURF anlegen. Erst wenn André den Entwurf veröffentlicht,
# sehen die Tester das Update (die App fragt `releases/latest`).
# Probelauf ohne Tag: Actions → Release → Run workflow (oder bei Änderungen an diesem Workflow im PR).
# Dann läuft alles bis zum fertigen Ordner, aber es wird KEIN Release angelegt; der Ordner hängt als
# Artefakt „release-probe“ am Lauf.
# Ablauf und Einrichtung: docs/updater.md, docs/release.md
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/release-check.sh
      - packaging/test-release-check.sh

permissions:
  contents: read

jobs:
  # Schnell und vor den teuren Bauten: Tag = Cargo-Version = CHANGELOG, fester UpgradeCode.
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prüfskript testen
        run: packaging/test-release-check.sh
      - name: Tag, Cargo-Version, CHANGELOG, UpgradeCode
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: packaging/release-check.sh version "$TAG"
      - name: Tag liegt auf main
        if: github.ref_type == 'tag'
        run: |
          set -eu
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Der Tag zeigt auf einen Stand, der nicht in main liegt. Erst mergen, dann taggen."; exit 1; }

  windows:
    needs: pruefen
    uses: ./.github/workflows/windows-build.yml

  linux:
    needs: pruefen
    uses: ./.github/workflows/linux-build.yml

  paket:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release anlegen (nur bei einem Tag)
    env:
      IS_TAG: ${{ github.ref_type == 'tag' }}
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: woa-*
          merge-multiple: true
          path: dist
      - name: Version und Dateien prüfen
        run: |
          set -eu
          ls -l dist
          echo "VERSION=$(packaging/release-check.sh version "$TAG")" >> "$GITHUB_ENV"
          # latest.json entsteht erst unten; hier nur, was die Bauten liefern.
          v="$(packaging/release-check.sh version "$TAG")"
          for f in "woa-$v-x64.msi" "woa-$v-windows-x64.zip" "WOA-$v-x86_64.AppImage" "woa-$v.flatpak"; do
            [ -s "dist/$f" ] || { echo "::error::fehlt oder leer: dist/$f"; exit 1; }
          done
          # Nichts Fremdes im Ordner (z. B. ein Test-MSI einer anderen Version).
          [ "$(ls dist | wc -l)" = 4 ] || { echo "::error::unerwartete Dateien in dist"; exit 1; }
          echo "MSI=dist/woa-$v-x64.msi" >> "$GITHUB_ENV"
      - name: minisign installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
      - name: MSI signieren (Pflicht)
        env:
          WOA_UPDATER_KEY: ${{ secrets.WOA_UPDATER_KEY }}
        run: |
          set -eu
          head -n1 packaging/windows/updater.pub | grep -q '^untrusted comment:' \
            || { echo "::error::packaging/windows/updater.pub ist kein minisign-Schlüssel"; exit 1; }
          if [ -z "${WOA_UPDATER_KEY:-}" ]; then
            if [ "$IS_TAG" = true ]; then
              echo "::error::Secret WOA_UPDATER_KEY fehlt. Apps lehnen unsignierte Updates ab (docs/updater.md)."
              exit 1
            fi
            echo "::warning::Probelauf: WOA_UPDATER_KEY nicht verfügbar (Pull Request). Ein Tag würde hier abbrechen."
            echo "SIGNED=no" >> "$GITHUB_ENV"
          else
            key=$(mktemp)
            trap 'rm -f "$key"' EXIT
            chmod 600 "$key"
            printf '%s\n' "$WOA_UPDATER_KEY" > "$key"
            minisign -S -s "$key" -m "$MSI" -t "woa $VERSION"
            rm -f "$key"
            minisign -V -p packaging/windows/updater.pub -m "$MSI"
            echo "SIGNED=yes" >> "$GITHUB_ENV"
          fi
      - name: latest.json und Notizen
        run: |
          set -eu
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          file=$(basename "$MSI")
          sha=$(sha256sum "$MSI" | cut -d' ' -f1)
          # Abschnitt dieser Version aus dem CHANGELOG (bis zur nächsten "## ").
          awk -v v="## $VERSION " 'index($0, v) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Version $VERSION" > notes.md
          sig=""
          if [ "$SIGNED" = yes ]; then sig="$base/$file.minisig"; fi
          jq -n --arg v "$VERSION" --rawfile n notes.md --arg u "$base/$file" --arg s "$sig" --arg h "$sha" \
            '{version: $v, notes: $n, msi_url: $u, msi_sha256: $h} + (if $s != "" then {msi_sig_url: $s} else {} end)' \
            > dist/latest.json
          cat dist/latest.json
      - name: Vollständigkeit prüfen und SHA256SUMS schreiben
        run: |
          set -eu
          WOA_TAG="$TAG" packaging/release-check.sh dist dist
          packaging/release-check.sh sums dist
      - name: Probelauf, Ordner als Artefakt
        if: env.IS_TAG != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-probe
          path: dist
          retention-days: 7
      - name: Release als Entwurf anlegen
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "WOA $VERSION" --notes-file notes.md \
            dist/*
          gh release view "$GITHUB_REF_NAME" --json isDraft,assets --jq '"Entwurf: \(.isDraft), Dateien: \(.assets | map(.name) | join(", "))"'
