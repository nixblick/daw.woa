name: Windows-Bau
# Von Hand starten (Actions → Windows-Bau → Run workflow) oder per `gh workflow run windows-build.yml`.
# Ergebnis als Artefakt am Lauf: woa-<version>-x64.msi (Installer, Startmenü-Eintrag, Update ersetzt die alte
# Version) und ein ZIP mit woa.exe, woa-headless.exe, woa-streamd.exe zum Auspacken ohne Installation.
# Unsigniert; Windows SmartScreen fragt beim ersten Start nach („Weitere Informationen“ → „Trotzdem ausführen“).
on:
  workflow_dispatch:
  # Vom Release-Workflow (release.yml) aufgerufen.
  workflow_call:
  # Prüft Änderungen am Installer schon im PR.
  pull_request:
    paths:
      - packaging/windows/**
      - packaging/fetch-soundfont.sh
      - .github/workflows/windows-build.yml
      - apps/woa/build.rs
      - apps/woa/Cargo.toml

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p woa -p woa-headless -p woa-streamd
      - name: Icon-Ressource in woa.exe prüfen
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          function IconHash($p) {
            $ico = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $p))
            $ms = New-Object System.IO.MemoryStream
            $ico.ToBitmap().Save($ms, [System.Drawing.Imaging.ImageFormat]::Png)
            [Convert]::ToBase64String([System.Security.Cryptography.SHA256]::Create().ComputeHash($ms.ToArray()))
          }
          # woa-headless.exe hat keine Ressource und zeigt das Windows-Standardsymbol.
          $woa = IconHash 'target/release/woa.exe'; $std = IconHash 'target/release/woa-headless.exe'
          if ($woa -eq $std) { throw 'woa.exe hat kein eigenes Icon (Standardsymbol)' }
          Write-Host "ok: woa.exe trägt das WOA-Icon ($woa), Standard wäre $std"
      - name: SoundFont laden (feste SHA-256, #265)
        shell: bash
        run: packaging/fetch-soundfont.sh dist/sounds
      - name: Paket packen
        shell: pwsh
        run: |
          $v = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages | Where-Object name -eq 'woa' | Select-Object -ExpandProperty version
          New-Item -ItemType Directory -Force woa-windows | Out-Null
          Copy-Item target/release/woa.exe, target/release/woa-headless.exe, target/release/woa-streamd.exe, LICENSE, README.md, CHANGELOG.md woa-windows/
          Copy-Item -Recurse dist/sounds woa-windows/sounds
          if (-not (Test-Path woa-windows/sounds/GeneralUser-GS.sf2)) { throw 'SoundFont fehlt im ZIP' }
          Compress-Archive -Path woa-windows/* -DestinationPath "woa-$v-windows-x64.zip"
          "WOA_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: MSI bauen (WiX 5)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix build packaging/windows/woa.wxs -arch x64 -d Version=$env:WOA_VERSION -d Bin=target\release -o "woa-$env:WOA_VERSION-x64.msi"
      - name: MSI-Upgrade alt nach neu prüfen
        shell: pwsh
        run: ./packaging/windows/test-upgrade.ps1 -Version $env:WOA_VERSION -Bin target\release -Msi "woa-$env:WOA_VERSION-x64.msi"
      - name: SoundFont im ZIP und MSI prüfen
        shell: pwsh
        run: |
          Expand-Archive "woa-$env:WOA_VERSION-windows-x64.zip" "$env:RUNNER_TEMP/zip"
          if (-not (Test-Path "$env:RUNNER_TEMP/zip/sounds/GeneralUser-GS.sf2")) { throw 'ZIP: sounds/GeneralUser-GS.sf2 fehlt' }
          if (-not (Test-Path "$env:RUNNER_TEMP/zip/sounds/GeneralUser-GS-LICENSE.txt")) { throw 'ZIP: Lizenz fehlt' }
          Write-Host 'ok: ZIP enthält sounds/GeneralUser-GS.sf2 und Lizenz (MSI prüft test-upgrade.ps1 nach der Installation)'
      - uses: actions/upload-artifact@v4
        with:
          name: woa-${{ env.WOA_VERSION }}-windows-x64
          path: |
            woa-*-windows-x64.zip
            woa-*-x64.msi
          retention-days: 30
