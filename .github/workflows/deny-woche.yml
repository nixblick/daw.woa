name: deny (wöchentlich)
# Volle Prüfung der Abhängigkeiten einmal je Woche und auf Knopfdruck: neue Advisories und
# zurückgezogene Pakete (yanked) fallen hier auf, auch wenn niemand Cargo.lock anfasst. Ein
# Rotlauf hier ist ein echter Befund: `cargo update -p <paket>` oder Eintrag in deny.toml.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check
