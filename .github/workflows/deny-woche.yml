name: deny (wöchentlich)
# Volle Prüfung der Abhängigkeiten einmal je Woche und auf Knopfdruck: neue Advisories und
# zurückgezogene Pakete (yanked) fallen hier auf, auch wenn niemand Cargo.lock anfasst. Ein
# Rotlauf hier ist ein echter Befund: `cargo update -p <paket>` oder Eintrag in deny.toml.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2
        with:
          tool: cargo-deny
      - run: cargo deny check
