name: CI
on:
  push:
    branches: [main]
  pull_request:

# Ein neuer Push auf denselben PR-Zweig bricht den alten Lauf ab, statt ihn zu Ende (und
# womöglich rot) laufen zu lassen. Abgebrochen ist nicht fehlgeschlagen: keine Fehlermail.
# Auf main läuft jeder Push zu Ende, damit jeder Stand dort ein Ergebnis hat.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Fenster und Aufnahme nutzen cpal; Linux braucht dafür die ALSA-Header.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Geräteausgabe (cpal) nur kompilieren, nicht abspielen; Windows braucht keine ALSA-Header.
      - if: runner.os == 'Windows'
        run: cargo clippy -p woa-engine --features device --all-targets -- -D warnings

  # Pflichtprüfung „deny“ (Branch-Schutz), läuft daher immer. Lizenzen, Bans und Quellen hängen
  # nur am eigenen Code und laufen immer. Advisories/yanked ändern sich von außen (ein Paket
  # wird zurückgezogen, ein Advisory erscheint) und machten fremde PRs rot, die Cargo.lock gar
  # nicht anfassen. Sie laufen hier nur, wenn Cargo.lock, ein Cargo.toml oder deny.toml sich
  # ändern; sonst prüft sie der wöchentliche Lauf (deny-woche.yml) mit voller Schärfe.
  # cargo-deny direkt auf dem Runner statt im Container der cargo-deny-action: deren Container
  # kannte die Toolchain aus rust-toolchain.toml nicht („override toolchain … musl is not
  # installed“).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check bans licenses sources
      - name: Abhängigkeiten geändert?
        id: deps
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE '(^|/)(Cargo\.lock|Cargo\.toml|deny\.toml)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.deps.outputs.changed == 'true'
        run: cargo deny check advisories
