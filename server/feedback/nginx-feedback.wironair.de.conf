# Vorlage: eigener vhost im bretteins-Edge-nginx (Container im Netz bretteins_net)
# fuer die daw.woa-Feedback-Instanz. Zertifikat per certbot --webroot wie beim Edge
# (HTTP-01, edge_acme_webroot). Pfade unten an edge_cert-Ablage anpassen.

server {
    listen 80;
    listen [::]:80;
    server_name feedback.wironair.de;

    location /.well-known/acme-challenge/ {
        root /srv/acme;                # = edge_acme_webroot (Default)
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name feedback.wironair.de;

    ssl_certificate     /etc/nginx/certs/feedback.wironair.de/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/feedback.wironair.de/privkey.pem;

    # Screenshots kommen als Base64 im JSON
    client_max_body_size 12m;

    resolver 127.0.0.11 valid=30s;     # Docker-DNS: Container darf spaeter starten

    # Die App kennt /feedback und /api/feedback (app.py); Medien und Dash liegen
    # unter /api/feedback/... Alles andere: 404.
    location ~ ^/(api/)?feedback(/|$) {
        set $upstream_daw_feedback daw-woa-feedback:8081;
        proxy_pass http://$upstream_daw_feedback;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Hörer-Statistik (server/hoerer): nur lesend, aggregierte Zahlen.
    location ~ ^/api/hoerer(/|$) {
        limit_except GET { deny all; }
        set $upstream_daw_hoerer daw-woa-hoerer:8082;
        proxy_pass http://$upstream_daw_hoerer;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    # Titel für Hörer (server/hoerer, POST /api/titel): die App weist sich mit dem
    # Quellkennwort aus, admin.cgi bleibt im Docker-Netz. Gebremst gegen Raten
    # (limit_req_zone $binary_remote_addr zone=woa_titel:1m rate=30r/m; im http-Block).
    location = /api/titel {
        limit_except POST { deny all; }
        client_max_body_size 2k;
        limit_req zone=woa_titel burst=10 nodelay;
        set $upstream_daw_hoerer daw-woa-hoerer:8082;
        proxy_pass http://$upstream_daw_hoerer;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location = /healthz {
        set $upstream_daw_feedback daw-woa-feedback:8081;
        proxy_pass http://$upstream_daw_feedback;
    }
    location / {
        return 404;
    }
}
