[package]
name = "woa-updater"
description = "WOA: Auto-Updater (signierte MSI-Updates von GitHub Releases)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
minisign-verify = "0.2.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.21"
tracing = "0.1.44"

# Wie woa-telemetry: rustls, kein OpenSSL.
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"
