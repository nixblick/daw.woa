[package]
name = "woa-radio"
description = "WOA: Playlist, Cart-Wall, Sendeplan, Ducking"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
basedrop = "0.1.3"
hound = "3.5.1"
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
woa-dsp = { version = "0.20", path = "../dsp" }
woa-engine = { version = "0.20", path = "../engine" }

[dev-dependencies]
assert_no_alloc = "1.1.2"
tempfile = "3.27.0"
