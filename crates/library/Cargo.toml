[package]
name = "woa-library"
description = "WOA: Bibliothek, Analyse, Suche (SQLite)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
woa-engine = { version = "0.31", path = "../engine" }
woa-dsp = { version = "0.31", path = "../dsp" }

[dev-dependencies]
hound = "3.5.1"
tempfile = "3.27.0"
