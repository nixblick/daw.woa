[package]
name = "woa-gui"
description = "WOA: egui-Oberfläche, drei Layouts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
eframe = "0.35.0"
png = "0.18.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
woa-dsp = { version = "0.1.0", path = "../dsp" }
woa-engine = { version = "0.1.0", path = "../engine", features = ["device"] }
woa-model = { version = "0.1.0", path = "../model" }
woa-telemetry = { version = "0.1.0", path = "../telemetry" }

[dev-dependencies]
tempfile = "3.27.0"
