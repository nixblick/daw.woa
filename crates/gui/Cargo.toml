[package]
name = "woa-gui"
description = "WOA: egui-Oberfläche, drei Layouts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
eframe = "0.35.0"
egui-phosphor = { version = "0.13.0", default-features = false, features = ["regular", "fill"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
png = "0.18.1"
rfd = "0.17.2"
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
woa-agent = { version = "0.35", path = "../agent" }
woa-assistant = { version = "0.35", path = "../assistant" }
woa-dsp = { version = "0.35", path = "../dsp" }
woa-io = { version = "0.35", path = "../io" }
woa-engine = { version = "0.35", path = "../engine", features = ["device"] }
woa-guests = { version = "0.35", path = "../guests" }
woa-plugins = { version = "0.35", path = "../plugins" }
woa-library = { version = "0.35", path = "../library" }
woa-model = { version = "0.35", path = "../model" }
woa-radio = { version = "0.35", path = "../radio" }
woa-remote = { version = "0.35", path = "../remote" }
woa-secrets = { version = "0.35", path = "../secrets" }
woa-stream = { version = "0.35", path = "../stream" }
woa-telemetry = { version = "0.35", path = "../telemetry" }
woa-updater = { version = "0.35", path = "../updater" }

[dev-dependencies]
assert_no_alloc = "1.1.2"
midir = "0.11.1"
tempfile = "3.27.0"
hound = "3.5.1"
egui_kittest = "0.35"
