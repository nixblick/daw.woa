[package]
name = "woa-engine"
description = "WOA: Audio-Graph, RT-Thread, Transport, Aufnahme"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arc-swap = "1.9.3"
basedrop = "0.1.3"
cpal = { version = "0.18.2", optional = true }
flacenc = "0.5.1"
hound = "3.5.1"
mp3lame-encoder = "0.2.5"
rtrb = "0.4.1"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "mp2", "flac", "ogg", "vorbis", "isomp4", "aac", "alac", "aiff", "caf", "pcm", "id3v1", "id3v2", "ape"] }
woa-dsp = { version = "0.22", path = "../dsp" }
woa-model = { version = "0.22", path = "../model" }

[target.'cfg(target_os = "linux")'.dependencies]
pulseaudio = { version = "0.3.2", optional = true }

[features]
device = ["dep:cpal", "dep:pulseaudio"]

[dev-dependencies]
assert_no_alloc = "1.1.2"
tempfile = "3.27.0"
