[package]
name = "woa-engine"
description = "WOA: Audio-Graph, RT-Thread, Transport, Aufnahme"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arc-swap = "1.9.3"
basedrop = "0.1.3"
cpal = { version = "0.18.2", optional = true }
hound = "3.5.1"
rtrb = "0.4.1"
woa-dsp = { version = "0.1.0", path = "../dsp" }
woa-model = { version = "0.1.0", path = "../model" }

[features]
device = ["dep:cpal"]

[dev-dependencies]
assert_no_alloc = "1.1.2"
