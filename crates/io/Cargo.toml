[package]
name = "woa-io"
description = "WOA: Audio-/MIDI-Geräte, Datei-Import/-Export"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
midir = "0.11.1"
quick-xml = "0.42.0"
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
tracing = "0.1.44"
woa-dsp = { version = "0.32", path = "../dsp" }
woa-model = { version = "0.32", path = "../model" }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_no_alloc = "1.1.2"
hound = "3.5.1"
insta = "1.49.0"
serde_json = "1.0.154"
