[package]
name = "woa-io"
description = "WOA: Audio-/MIDI-Geräte, Datei-Import/-Export"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
midir = "0.11.1"
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
woa-dsp = { version = "0.9", path = "../dsp" }
woa-model = { version = "0.9", path = "../model" }

[dev-dependencies]
assert_no_alloc = "1.1.2"
serde_json = "1.0.154"
