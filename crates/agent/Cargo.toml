[package]
name = "woa-agent"
description = "WOA: MCP-Server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rmcp = { version = "3.8.0", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std"] }
woa-dsp = { path = "../dsp", version = "0.13" }
woa-engine = { path = "../engine", version = "0.13" }
woa-model = { path = "../model", version = "0.13" }
woa-radio = { path = "../radio", version = "0.13" }
woa-stream = { path = "../stream", version = "0.13" }

[dev-dependencies]
hound = "3.5.1"
rmcp = { version = "3.8.0", default-features = false, features = ["macros", "server", "client", "transport-io"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "io-util"] }
