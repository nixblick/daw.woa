[package]
name = "woa-agent"
description = "WOA: MCP-Server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
png = "0.18.1"
bytes = "1"
getrandom = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
rmcp = { version = "3.8.0", default-features = false, features = ["macros", "server", "transport-io", "transport-streamable-http-server"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std", "net", "time", "sync"] }
tokio-util = "0.7"
tower-service = "0.3"
ureq = { version = "3.5.0", default-features = false }
woa-dsp = { path = "../dsp", version = "0.34" }
woa-plugins = { path = "../plugins", version = "0.34" }
woa-engine = { path = "../engine", version = "0.34" }
woa-model = { path = "../model", version = "0.34" }
woa-library = { path = "../library", version = "0.34" }
woa-radio = { path = "../radio", version = "0.34" }
woa-stream = { path = "../stream", version = "0.34" }

[dev-dependencies]
hound = "3.5.1"
rmcp = { version = "3.8.0", default-features = false, features = ["macros", "server", "client", "transport-io"] }
png = "0.18.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "io-util"] }
ureq = { version = "3.5.0", default-features = false }
