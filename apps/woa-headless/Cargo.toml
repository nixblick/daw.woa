[package]
name = "woa-headless"
description = "WOA: Engine + MCP, für Agent und Tests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
woa-agent = { path = "../../crates/agent", version = "0.21" }
woa-dsp = { path = "../../crates/dsp", version = "0.21" }
woa-engine = { path = "../../crates/engine", version = "0.21" }
hound = "3.5.1"
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
woa-model = { path = "../../crates/model", version = "0.21" }
woa-radio = { path = "../../crates/radio", version = "0.21" }
woa-stream = { path = "../../crates/stream", version = "0.21" }
woa-telemetry = { path = "../../crates/telemetry", version = "0.21" }

[features]
# Echte Audio-Ausgabe (cpal). Unter Linux braucht der Bau alsa-lib-devel.
device = ["woa-engine/device"]

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
