[package]
name = "woa"
description = "WOA: Desktop-App"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
eframe = "0.35.0"
tracing = "0.1.44"
woa-gui = { version = "0.29", path = "../../crates/gui" }
woa-plugins = { version = "0.29", path = "../../crates/plugins" }
woa-radio = { version = "0.29", path = "../../crates/radio" }
woa-telemetry = { version = "0.29", path = "../../crates/telemetry" }

# Nur für die X11-Wahl der Ereignisschleife (#56); winit 0.30 kommt ohnehin über eframe.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["x11"] }
