[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Nur "unmaintained", keine Sicherheitsluecke; alle transitiv ueber eframe/egui
# (winit -> sctk-adwaita -> ab_glyph, accesskit_unix -> zbus). Entfaellt mit
# kuenftigen eframe/winit-Versionen; bei jedem eframe-Update neu pruefen.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained, via winit/sctk-adwaita" },
    { id = "RUSTSEC-2026-0370", reason = "zbus split crate unmaintained, via accesskit_unix" },
    { id = "RUSTSEC-2026-0371", reason = "zbus split crate unmaintained, via accesskit_unix" },
    { id = "RUSTSEC-2026-0372", reason = "zbus split crate unmaintained, via accesskit_unix" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained, nur Makro zur Bauzeit, via lofty_attr" },
]

[licenses]
version = 2
# Nur GPL-3.0-kompatible Lizenzen
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "GPL-3.0-only", "GPL-3.0-or-later",
    "LGPL-3.0-only", "LGPL-3.0-or-later", "CC0-1.0", "BSL-1.0",
]
confidence-threshold = 0.9

# Mozillas CA-Liste fuer TLS (ureq/rustls, woa-telemetry). CDLA-Permissive-2.0 ist eine
# freizuegige Datenlizenz ohne Copyleft; nur fuer diese eine Crate freigegeben.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# egui-Standardschriften (eingebettete Fontdaten, kein Code): OFL-1.1 und Ubuntu Font
# Licence. Nur fuer diese eine Crate freigegeben; Pruefung durch Andre offen.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

# MP3-Export (LAME). Die Crates schreiben die veraltete SPDX-Kennung "LGPL-3.0", gemeint ist
# LGPL-3.0-only (oben ohnehin erlaubt, GPLv3-vertraeglich). Nur fuer diese zwei Crates.
[[licenses.exceptions]]
crate = "mp3lame-encoder"
allow = ["LGPL-3.0"]

[[licenses.exceptions]]
crate = "mp3lame-sys"
allow = ["LGPL-3.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
