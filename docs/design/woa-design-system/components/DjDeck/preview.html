<!-- @dsCard group="Party" height=500 width=1600 subtitle="DJ-Deck: BPM, Tonart, Übersicht mit Hot Cues und Loop, Hot Cues, Auto-Loop, Cue · Play · Sync, Tempo-Fader" -->
<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>WOA</title>
<style>body{padding:16px}.cap{font-family:var(--font-label);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin:0 0 6px}</style></head>
<body>
<div class="woa-dj" style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div class="woa-djd" style="--dc:var(--da)">
 <div class="woa-djd__hd"><span class="woa-djm__lab" style="color:var(--da)">DECK A</span><span class="woa-pdeck__badge is-live">LÄUFT</span><div class="woa-djd__ti"><b>Du bist nicht da, wo du denkst!</b><span>0unvBW91wY0 · 9:22 · −17.2 LUFS</span></div><span class="woa-key-chip is-match" data-tip="Tonart (Camelot)" data-hint="Grün: passt zum anderen Deck">8A</span><div class="woa-lcd woa-djd__lcd"><span class="woa-seg" data-ghost="888.8"><span>124.0</span></span><small>BPM</small></div><div class="woa-lcd" style="padding:6px 10px"><span class="woa-seg" data-ghost="88:88" style="font-size:24px"><span>06:41</span></span></div></div>
 <div class="woa-ov" data-tip="Übersicht" data-hint="Klick springt an die Stelle"><canvas data-woa-wave data-seed="4" data-played=".28" data-color="--da" data-step="2"></canvas><i class="woa-ov__hc" data-n="1" style="left:8%;--c:var(--track-2)"></i><i class="woa-ov__hc" data-n="2" style="left:31%;--c:var(--track-4)"></i><i class="woa-ov__hc" data-n="3" style="left:55%;--c:var(--track-3)"></i></div>
 <div class="woa-djd__body"><div class="woa-jog" style="--d:170px" data-tip="Jogwheel" data-hint="Drehen am Rand: Tempo anschieben · oben: scratchen"><div class="woa-jog__mark"></div><div class="woa-jog__center"></div></div><div class="woa-djd__ctl">
 <div class="woa-hc"><button style="--c:var(--track-2)" data-tip="Hot Cue 1" data-hint="Klick springt · Umschalt+Klick löscht">1</button><button style="--c:var(--track-4)" data-tip="Hot Cue 2" data-hint="Klick springt · Umschalt+Klick löscht">2</button><button style="--c:var(--track-3)" data-tip="Hot Cue 3" data-hint="Klick springt · Umschalt+Klick löscht">3</button><button class="is-empty" data-tip="Hot Cue 4 setzen">4</button></div>
 <div class="woa-loop"><div class="woa-segs"><button aria-pressed="false">1</button><button aria-pressed="false">2</button><button aria-pressed="false">4</button><button aria-pressed="false">8</button><button aria-pressed="false">16</button></div><button class="woa-key" style="--c:var(--accent-2);--c-on:var(--on-accent-2)" data-woa-icon="loop" data-tip="Auto-Loop in Schlägen" data-kbd="L">Loop</button></div>
 <div class="woa-djd__keys">
  <button class="woa-bigkey woa-bigkey--cue" data-tip="Cue" data-hint="Steht das Deck: Cue-Punkt setzen. Halten: ab Cue anhören, Loslassen springt zurück">Cue</button>
  <button class="woa-bigkey is-on is-pulse" data-woa-icon="pause" data-tip="Pause">Pause</button>
  <button class="woa-bigkey woa-bigkey--alt" data-tip="Sync" data-hint="Tempo und Takt an das andere Deck angleichen">Sync</button>
  <button class="woa-ib woa-ib--lg" data-woa-icon="pitch" data-tip="Keylock: Tonhöhe halten" data-kbd="K" aria-pressed="true"></button>
 </div>
</div><div class="woa-tempo"><span class="woa-label" style="font-size:10px">Tempo</span><div class="woa-fader" data-fmt="pct" style="--v:0.500;grid-template-columns:24px" data-default=".5"><div class="woa-fader__track" role="slider" aria-label="Tempo Deck A" data-tip="Tempo ±8 %" data-hint="Doppelklick = 0 %"><div class="woa-fader__cap"></div></div></div><span class="woa-tempo__v">+0.0 %</span><div class="woa-tempo__nudge"><button class="woa-ib woa-ib--sm" data-woa-icon="left" data-tip="Langsamer anschieben"></button><button class="woa-ib woa-ib--sm" data-woa-icon="right" data-tip="Schneller anschieben"></button></div></div></div>
</div><div class="woa-djd is-mirror" style="--dc:var(--db)">
 <div class="woa-djd__hd"><span class="woa-djm__lab" style="color:var(--db)">DECK B</span><span class="woa-pdeck__badge ">BEREIT · CUE</span><div class="woa-djd__ti"><b>Ändere deine Gedanken! CB</b><span>CB · 3:02 · −13.8 LUFS</span></div><span class="woa-key-chip is-match" data-tip="Tonart (Camelot)" data-hint="Grün: passt zum anderen Deck">8A</span><div class="woa-lcd woa-djd__lcd"><span class="woa-seg" data-ghost="888.8"><span>124.0</span></span><small>BPM</small></div><div class="woa-lcd" style="padding:6px 10px"><span class="woa-seg" data-ghost="88:88" style="font-size:24px"><span>03:02</span></span></div></div>
 <div class="woa-ov" data-tip="Übersicht" data-hint="Klick springt an die Stelle"><canvas data-woa-wave data-seed="8" data-played="0" data-color="--db" data-step="2"></canvas><i class="woa-ov__hc" data-n="1" style="left:8%;--c:var(--track-2)"></i><i class="woa-ov__hc" data-n="2" style="left:31%;--c:var(--track-4)"></i><i class="woa-ov__hc" data-n="3" style="left:55%;--c:var(--track-3)"></i></div>
 <div class="woa-djd__body"><div class="woa-tempo"><span class="woa-label" style="font-size:10px">Tempo</span><div class="woa-fader" data-fmt="pct" style="--v:0.600;grid-template-columns:24px" data-default=".5"><div class="woa-fader__track" role="slider" aria-label="Tempo Deck B" data-tip="Tempo ±8 %" data-hint="Doppelklick = 0 %"><div class="woa-fader__cap"></div></div></div><span class="woa-tempo__v">+1.6 %</span><div class="woa-tempo__nudge"><button class="woa-ib woa-ib--sm" data-woa-icon="left" data-tip="Langsamer anschieben"></button><button class="woa-ib woa-ib--sm" data-woa-icon="right" data-tip="Schneller anschieben"></button></div></div><div class="woa-djd__ctl">
 <div class="woa-hc"><button style="--c:var(--track-2)" data-tip="Hot Cue 1" data-hint="Klick springt · Umschalt+Klick löscht">1</button><button style="--c:var(--track-4)" data-tip="Hot Cue 2" data-hint="Klick springt · Umschalt+Klick löscht">2</button><button style="--c:var(--track-3)" data-tip="Hot Cue 3" data-hint="Klick springt · Umschalt+Klick löscht">3</button><button class="is-empty" data-tip="Hot Cue 4 setzen">4</button></div>
 <div class="woa-loop"><div class="woa-segs"><button aria-pressed="false">1</button><button aria-pressed="false">2</button><button aria-pressed="false">4</button><button aria-pressed="false">8</button><button aria-pressed="false">16</button></div><button class="woa-key" style="--c:var(--accent-2);--c-on:var(--on-accent-2)" data-woa-icon="loop" data-tip="Auto-Loop in Schlägen" data-kbd="L">Loop</button></div>
 <div class="woa-djd__keys">
  <button class="woa-bigkey woa-bigkey--cue is-lit" data-tip="Cue" data-hint="Steht das Deck: Cue-Punkt setzen. Halten: ab Cue anhören, Loslassen springt zurück">Cue</button>
  <button class="woa-bigkey" data-woa-icon="play" data-tip="Play">Play</button>
  <button class="woa-bigkey woa-bigkey--alt is-on" data-tip="Sync" data-hint="Tempo und Takt an das andere Deck angleichen">Sync</button>
  <button class="woa-ib woa-ib--lg" data-woa-icon="pitch" data-tip="Keylock: Tonhöhe halten" data-kbd="K" aria-pressed="true"></button>
 </div>
</div><div class="woa-jog is-paused" style="--d:170px" data-tip="Jogwheel" data-hint="Drehen am Rand: Tempo anschieben · oben: scratchen"><div class="woa-jog__mark"></div><div class="woa-jog__center"></div></div></div>
</div></div>
<script>WOA.init();</script>
</body>
</html>
