<!-- @dsCard group="Produzent" height=420 width=900 subtitle="Spurkopf fest 64 px: Audio (Eingang · Pegel · Pan), MIDI (Instrument links → Klangauswahl, MIDI-Eingang rechts)" -->
<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>WOA</title>
<style>body{padding:16px}.cap{font-family:var(--font-label);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin:0 0 6px}</style></head>
<body>

<div style="display:grid;grid-template-columns:260px minmax(0,1fr);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;max-width:820px;background:var(--well)">
 <div class="woa-tk" style="--t:var(--track-1)">
 <div class="woa-tk__r1"><button class="woa-arm" aria-pressed="false" data-woa-icon="rec" data-tip="Aufnahme scharf" data-kbd="Umschalt+R"></button><span class="woa-tk__n" data-tip="Umbenennen" data-hint="Doppelklick">Bett-Musik</span><button class="woa-key woa-key--sm woa-key--sq woa-key--rec" data-tip="Stumm" data-kbd="M">M</button><button class="woa-key woa-key--sm woa-key--sq woa-key--warn" data-tip="Solo" data-kbd="S">S</button><button class="woa-ib woa-ib--sm woa-ib--danger woa-tk__del" data-woa-icon="trash" data-tip="Spur löschen" data-kbd="Entf" data-hint="Rückgängig mit Strg+Z"></button></div>
 <div class="woa-tk__r2"><span class="woa-select" role="button" data-tip="Eingang"><span data-woa-icon="mic" style="display:contents"></span><span>Datei</span><span data-woa-icon="down" style="display:contents"></span></span><span class="woa-num" data-tip="Pegel (= Fader)" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="db" data-min="-60" data-max="6" data-step="0.1" data-default="0" data-value="-3.0"><span class="woa-num__v"></span><span class=woa-num__u>dB</span></span><span class="woa-num woa-num--s" data-tip="Panorama" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="pan" data-min="-100" data-max="100" data-step="1" data-default="0" data-value="0"><span class="woa-num__v"></span></span></div>
 <div class="woa-meter" data-ch="2" data-segs="16" data-level="0.6"></div>
</div><div class="woa-lane" style="--t:var(--track-1)"><span class="woa-dim" style="position:absolute;left:12px;top:22px;font-size:12px">Audio: Eingang · Pegel · Pan</span></div>
 <div class="woa-tk" style="--t:var(--track-3)">
 <div class="woa-tk__r1"><button class="woa-arm" aria-pressed="false" data-woa-icon="rec" data-tip="Aufnahme scharf" data-kbd="Umschalt+R"></button><span class="woa-tk__n">Klavier</span><button class="woa-key woa-key--sm woa-key--sq woa-key--rec" data-tip="Stumm" data-kbd="M">M</button><button class="woa-key woa-key--sm woa-key--sq woa-key--warn" data-tip="Solo" data-kbd="S">S</button><button class="woa-ib woa-ib--sm woa-ib--danger woa-tk__del" data-woa-icon="trash" data-tip="Spur löschen" data-kbd="Entf"></button></div>
 <div class="woa-tk__r2"><button class="woa-inst" aria-expanded="false" data-tip="Klang wählen" data-hint="Öffnet die Klangauswahl im Rack"><span data-woa-icon="keyboard" style="display:contents"></span><span>Flügel</span><span data-woa-icon="down" style="display:contents"></span></button><span class="woa-midiin is-hit" data-tip="MIDI-Eingang" data-hint="Klick: Gerät wählen"><span data-woa-icon="keyboard" style="display:contents"></span>Yamaha USB</span></div>
 <div class="woa-meter" data-ch="2" data-segs="16" data-level=".5"></div>
</div><div class="woa-lane" style="--t:var(--track-3)"><span class="woa-dim" style="position:absolute;left:12px;top:22px;font-size:12px">MIDI: Instrument (klickbar) · Eingang leuchtet bei Noten</span></div>
 <div class="woa-tk is-sel-track is-armed" style="--t:var(--track-4)">
 <div class="woa-tk__r1"><button class="woa-arm" aria-pressed="true" data-woa-icon="rec" data-tip="Aufnahme scharf" data-kbd="Umschalt+R"></button><span class="woa-tk__n">Bläsersatz</span><button class="woa-key woa-key--sm woa-key--sq woa-key--rec" data-tip="Stumm" data-kbd="M">M</button><button class="woa-key woa-key--sm woa-key--sq woa-key--warn" data-tip="Solo" data-kbd="S">S</button><button class="woa-ib woa-ib--sm woa-ib--danger woa-tk__del" data-woa-icon="trash" data-tip="Spur löschen" data-kbd="Entf"></button></div>
 <div class="woa-tk__r2"><button class="woa-inst" aria-expanded="true" data-tip="Klang wählen" data-hint="Öffnet die Klangauswahl im Rack"><span data-woa-icon="horn" style="display:contents"></span><span>Trompete</span><span data-woa-icon="down" style="display:contents"></span></button><span class="woa-midiin" data-tip="MIDI-Eingang" data-hint="Klick: Gerät wählen"><span data-woa-icon="keyboard" style="display:contents"></span>Yamaha USB</span></div>
 <div class="woa-meter" data-ch="2" data-segs="16" data-level=".5"></div>
</div><div class="woa-lane is-sel-track" style="--t:var(--track-4)"><span class="woa-dim" style="position:absolute;left:12px;top:22px;font-size:12px">gewählt + scharf, Klangauswahl offen</span></div>
 <div class="woa-tk" style="--t:var(--track-5)">
 <div class="woa-tk__r1"><button class="woa-arm" aria-pressed="false" data-woa-icon="rec" data-tip="Aufnahme scharf" data-kbd="Umschalt+R"></button><span class="woa-tk__n">Beat</span><button class="woa-key woa-key--sm woa-key--sq woa-key--rec" data-tip="Stumm" data-kbd="M">M</button><button class="woa-key woa-key--sm woa-key--sq woa-key--warn" data-tip="Solo" data-kbd="S">S</button><button class="woa-ib woa-ib--sm woa-ib--danger woa-tk__del" data-woa-icon="trash" data-tip="Spur löschen" data-kbd="Entf"></button></div>
 <div class="woa-tk__r2"><button class="woa-inst" aria-expanded="false" data-tip="Klang wählen" data-hint="Öffnet die Klangauswahl im Rack"><span data-woa-icon="grid" style="display:contents"></span><span>Standard-Kit</span><span data-woa-icon="down" style="display:contents"></span></button><span class="woa-midiin is-none" data-tip="MIDI-Eingang" data-hint="Klick: Gerät wählen"><span data-woa-icon="keyboard" style="display:contents"></span>kein Gerät</span></div>
 <div class="woa-meter" data-ch="2" data-segs="16" data-level=".5"></div>
</div><div class="woa-lane" style="--t:var(--track-5)"><span class="woa-dim" style="position:absolute;left:12px;top:22px;font-size:12px">kein MIDI-Gerät: gestrichelt</span></div>
 <div class="woa-tk" style="--t:var(--track-6)">
 <div class="woa-tk__r1"><button class="woa-arm" aria-pressed="false" data-woa-icon="rec" data-tip="Aufnahme scharf" data-kbd="Umschalt+R"></button><span class="woa-tk__n">Alt-Projekt</span><button class="woa-key woa-key--sm woa-key--sq woa-key--rec" data-tip="Stumm" data-kbd="M">M</button><button class="woa-key woa-key--sm woa-key--sq woa-key--warn" data-tip="Solo" data-kbd="S">S</button><button class="woa-ib woa-ib--sm woa-ib--danger woa-tk__del" data-woa-icon="trash" data-tip="Spur löschen" data-kbd="Entf"></button></div>
 <div class="woa-tk__r2"><button class="woa-inst" aria-expanded="false" data-tip="Klang wählen" data-hint="Öffnet die Klangauswahl im Rack"><span data-woa-icon="sine" style="display:contents"></span><span>Synth (einfach)</span><span data-woa-icon="down" style="display:contents"></span></button><span class="woa-midiin" data-tip="MIDI-Eingang" data-hint="Klick: Gerät wählen"><span data-woa-icon="keyboard" style="display:contents"></span>Yamaha USB</span></div>
 <div class="woa-meter" data-ch="2" data-segs="16" data-level=".5"></div>
</div><div class="woa-lane" style="--t:var(--track-6)"><span class="woa-dim" style="position:absolute;left:12px;top:22px;font-size:12px">alter Synth bleibt wählbar</span></div>
</div>
<script>WOA.init();</script>
</body>
</html>
