<!-- @dsCard group="Produzent" height=340 width=1180 subtitle="Leiste über der Zeitleiste: Audio, MIDI, Mehrfachauswahl, leer" -->
<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>WOA</title>
<style>body{padding:16px}.cap{font-family:var(--font-label);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin:0 0 6px}</style></head>
<body>

<div class="woa-col" style="gap:14px">
 <div><p class="cap">Audio-Clip</p><div class="woa-ci">
 <div class="woa-ci__id" style="--t:var(--track-1)"><span data-woa-icon="wave" style="display:contents"></span><span class="woa-ci__name" data-tip="Clip umbenennen" data-hint="Doppelklick auf den Namen">Bed Silvester 128 BPM</span></div>
 <div class="woa-ci__g"><span class="woa-ci__l">Fade</span><span class="woa-num woa-num--m" data-woa-icon="fadein" data-tip="Fade-In" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="int" data-min="0" data-max="10000" data-step="10" data-default="0" data-value="120"><span class="woa-num__v"></span><span class=woa-num__u>ms</span></span><span class="woa-num woa-num--m" data-woa-icon="fadeout" data-tip="Fade-Out" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="int" data-min="0" data-max="10000" data-step="10" data-default="0" data-value="800"><span class="woa-num__v"></span><span class=woa-num__u>ms</span></span></div>
 <div class="woa-ci__g"><span class="woa-ci__l">Gain</span><span class="woa-num" data-tip="Clip-Gain" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="db" data-min="-60" data-max="24" data-step="0.1" data-default="0" data-value="-2.5"><span class="woa-num__v"></span><span class=woa-num__u>dB</span></span><button class="woa-ib woa-ib--sm" data-woa-icon="normalize" data-tip="Normalisieren" data-hint="Spitze auf −1 dBFS"></button></div>
 <div class="woa-ci__g"><span class="woa-ci__l">Zeit</span><span class="woa-num woa-num--l" data-tip="Start (Takt.Schlag.Teil)" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fixed data-fmt="int" data-min="0" data-max="0" data-step="1" data-default="0" data-value="3.1.1"><span class="woa-num__u">Start</span><span class="woa-num__v">3.1.1</span></span><span class="woa-num woa-num--l" data-tip="Länge (Takte.Schläge.Teile)" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fixed data-fmt="int" data-min="0" data-max="0" data-step="1" data-default="0" data-value="8.0.0"><span class="woa-num__u">Länge</span><span class="woa-num__v">8.0.0</span></span><button class="woa-ib woa-ib--sm" data-woa-icon="tempo" data-tip="Tempo folgen" data-hint="Clip dehnt sich mit dem Projekttempo" aria-pressed="true"></button><span class="woa-num woa-num--s" data-woa-icon="pitch" data-tip="Tonhöhe in Halbtönen" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="st" data-min="-24" data-max="24" data-step="1" data-default="0" data-value="0"><span class="woa-num__v"></span><span class=woa-num__u>st</span></span></div>
 <div class="woa-ci__sp"></div>
 <div class="woa-ci__g"><div class="woa-ci__tools"><button class="woa-ib " data-woa-icon="cut" data-tip="Teilen" data-kbd="S"></button><button class="woa-ib " data-woa-icon="copy" data-tip="Duplizieren" data-kbd="Strg+D"></button><button class="woa-ib " data-woa-icon="reverse" data-tip="Umkehren" data-kbd="R"></button><button class="woa-ib " data-woa-icon="loop" data-tip="Loop" data-kbd="L" aria-pressed="false"></button><button class="woa-ib " data-woa-icon="mute" data-tip="Clip stumm" data-kbd="0" aria-pressed="false"></button></div><button class="woa-ib woa-ib--danger" data-woa-icon="trash" data-tip="Löschen" data-kbd="Entf"></button></div>
</div></div>
 <div><p class="cap">MIDI-Clip</p><div class="woa-ci">
 <div class="woa-ci__id" style="--t:var(--track-3)"><span data-woa-icon="piano" style="display:contents"></span><span class="woa-ci__name">Pad Am – F – C – G</span></div>
 <div class="woa-ci__g"><span class="woa-ci__l">Noten</span><span class="woa-select" role="button" data-tip="Quantisieren auf" style="width:84px"><span data-woa-icon="quantize" style="display:contents"></span><span>1/16</span><span data-woa-icon="down" style="display:contents"></span></span><button class="woa-ib woa-ib--sm" data-woa-icon="quantize" data-tip="Quantisieren" data-kbd="Q"></button><span class="woa-num woa-num--s" data-woa-icon="bolt" data-tip="Velocity (alle gewählten Noten)" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="int" data-min="1" data-max="127" data-step="1" data-default="100" data-value="96"><span class="woa-num__v"></span></span></div>
 <div class="woa-ci__g"><span class="woa-ci__l">Gain</span><span class="woa-num" data-tip="Clip-Gain" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="db" data-min="-60" data-max="24" data-step="0.1" data-default="0" data-value="0"><span class="woa-num__v"></span><span class=woa-num__u>dB</span></span></div>
 <div class="woa-ci__g"><span class="woa-ci__l">Zeit</span><span class="woa-num woa-num--l" data-tip="Start" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fixed data-fmt="int" data-min="0" data-max="0" data-step="1" data-default="0" data-value="5.1.1"><span class="woa-num__u">Start</span><span class="woa-num__v">5.1.1</span></span><span class="woa-num woa-num--l" data-tip="Länge" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fixed data-fmt="int" data-min="0" data-max="0" data-step="1" data-default="0" data-value="4.0.0"><span class="woa-num__u">Länge</span><span class="woa-num__v">4.0.0</span></span><span class="woa-num woa-num--s" data-woa-icon="pitch" data-tip="Transponieren" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="st" data-min="-24" data-max="24" data-step="1" data-default="0" data-value="0"><span class="woa-num__v"></span><span class=woa-num__u>st</span></span></div>
 <div class="woa-ci__sp"></div>
 <div class="woa-ci__g"><div class="woa-ci__tools"><button class="woa-ib " data-woa-icon="cut" data-tip="Teilen" data-kbd="S"></button><button class="woa-ib " data-woa-icon="copy" data-tip="Duplizieren" data-kbd="Strg+D"></button><button class="woa-ib " data-woa-icon="piano" data-tip="Piano-Roll öffnen" data-kbd="Enter"></button><button class="woa-ib " data-woa-icon="loop" data-tip="Loop" data-kbd="L" aria-pressed="true"></button><button class="woa-ib " data-woa-icon="mute" data-tip="Clip stumm" data-kbd="0" aria-pressed="false"></button></div><button class="woa-ib woa-ib--danger" data-woa-icon="trash" data-tip="Löschen" data-kbd="Entf"></button></div>
</div></div>
 <div><p class="cap">Mehrfachauswahl</p><div class="woa-ci">
 <div class="woa-ci__id" style="--t:var(--text-dim)"><span data-woa-icon="stack" style="display:contents"></span><span class="woa-ci__name">3 Clips</span></div>
 <div class="woa-ci__g"><span class="woa-ci__l">Fade</span><span class="woa-num woa-num--m is-mixed" data-woa-icon="fadein" data-tip="Fade-In – unterschiedlich, Eingabe gilt für alle" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="int" data-min="-60" data-max="12" data-step="0.1" data-default="0" data-value="0"><span class="woa-num__v">—</span><span class=woa-num__u>ms</span></span><span class="woa-num woa-num--m" data-woa-icon="fadeout" data-tip="Fade-Out (alle gleich)" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="int" data-min="0" data-max="10000" data-step="10" data-default="0" data-value="250"><span class="woa-num__v"></span><span class=woa-num__u>ms</span></span></div>
 <div class="woa-ci__g"><span class="woa-ci__l">Gain</span><span class="woa-num is-mixed" data-tip="Clip-Gain – unterschiedlich; Ziehen verschiebt alle relativ" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="db" data-min="-60" data-max="12" data-step="0.1" data-default="0" data-value="0"><span class="woa-num__v">—</span><span class=woa-num__u>dB</span></span><button class="woa-ib woa-ib--sm" data-woa-icon="normalize" data-tip="Normalisieren"></button></div>
 <div class="woa-ci__g"><span class="woa-ci__l">Zeit</span><span class="woa-num woa-num--l is-mixed" data-tip="Start – unterschiedlich" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="int" data-min="-60" data-max="12" data-step="0.1" data-default="0" data-value="0"><span class="woa-num__u">Start</span><span class="woa-num__v">—</span></span><span class="woa-num woa-num--l is-mixed" data-tip="Länge – unterschiedlich" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="int" data-min="-60" data-max="12" data-step="0.1" data-default="0" data-value="0"><span class="woa-num__u">Länge</span><span class="woa-num__v">—</span></span><button class="woa-ib woa-ib--sm" data-woa-icon="tempo" data-tip="Tempo folgen" aria-pressed="true"></button><span class="woa-num woa-num--s" data-woa-icon="pitch" data-tip="Tonhöhe" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="st" data-min="-24" data-max="24" data-step="1" data-default="0" data-value="0"><span class="woa-num__v"></span><span class=woa-num__u>st</span></span></div>
 <div class="woa-ci__sp"></div>
 <div class="woa-ci__g"><div class="woa-ci__tools"><button class="woa-ib " data-woa-icon="cut" data-tip="Teilen" data-kbd="S"></button><button class="woa-ib " data-woa-icon="copy" data-tip="Duplizieren" data-kbd="Strg+D"></button><button class="woa-ib " data-woa-icon="merge" data-tip="Zusammenfügen" data-kbd="Strg+J"></button><button class="woa-ib " data-woa-icon="mute" data-tip="Clips stumm" data-kbd="0" aria-pressed="false"></button></div><button class="woa-ib woa-ib--danger" data-woa-icon="trash" data-tip="Löschen" data-kbd="Entf"></button></div>
</div></div>
 <div><p class="cap">Nichts gewählt</p><div class="woa-ci is-empty"><div class="woa-ci__id"><span data-woa-icon="cursor" style="display:contents"></span><span class="woa-ci__name">Kein Clip gewählt</span></div><span class="woa-ci__hint">Clip anklicken · Umschalt für mehrere</span></div></div>
</div>
<script>WOA.init();</script>
</body>
</html>
