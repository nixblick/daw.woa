<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>WOA</title>
<style>body{padding:16px}</style></head>
<body>
<div class="woa-row" style="align-items:flex-start"><div class="woa-strip" style="--t:var(--track-4)">
 <div class="woa-keys"><button class="woa-key woa-key--sm woa-key--sq woa-key--rec">M</button><button class="woa-key woa-key--sm woa-key--sq woa-key--warn">S</button><button class="woa-key woa-key--sm woa-key--sq woa-key--cue is-lit" aria-label="PFL" data-woa-icon="phones"></button></div>
 <div class="woa-strip__fm"><div class="woa-fader" style="--v:0.7;grid-template-columns:22px;--fader-h:170px"><div class="woa-fader__track" role="slider" aria-label="Pegel Mikro 1"><div class="woa-fader__cap"></div></div></div><div class="woa-meter" data-ch="2" data-segs="28" data-level="0.62" style="height:170px"></div></div>
 <div class="woa-strip__name">Mikro 1</div>
</div><div class="woa-strip" style="--t:var(--track-2)">
 <div class="woa-keys"><button class="woa-key woa-key--sm woa-key--sq woa-key--rec">M</button><button class="woa-key woa-key--sm woa-key--sq woa-key--warn">S</button><button class="woa-key woa-key--sm woa-key--sq woa-key--cue" aria-label="PFL" data-woa-icon="phones"></button></div>
 <div class="woa-strip__fm"><div class="woa-fader" style="--v:0.66;grid-template-columns:22px;--fader-h:170px"><div class="woa-fader__track" role="slider" aria-label="Pegel Gast Lisa"><div class="woa-fader__cap"></div></div></div><div class="woa-meter" data-ch="2" data-segs="28" data-level="0.55" style="height:170px"></div></div>
 <div class="woa-strip__name">Gast Lisa</div>
</div><div class="woa-strip" style="--t:var(--track-1)">
 <div class="woa-keys"><button class="woa-key woa-key--sm woa-key--sq woa-key--rec">M</button><button class="woa-key woa-key--sm woa-key--sq woa-key--warn is-on">S</button><button class="woa-key woa-key--sm woa-key--sq woa-key--cue" aria-label="PFL" data-woa-icon="phones"></button></div>
 <div class="woa-strip__fm"><div class="woa-fader" style="--v:0.75;grid-template-columns:22px;--fader-h:170px"><div class="woa-fader__track" role="slider" aria-label="Pegel Musik"><div class="woa-fader__cap"></div></div></div><div class="woa-meter" data-ch="2" data-segs="28" data-level="0.8" style="height:170px"></div></div>
 <div class="woa-strip__name">Musik</div>
</div><div class="woa-strip" style="--t:var(--track-6)">
 <div class="woa-keys"><button class="woa-key woa-key--sm woa-key--sq woa-key--rec is-on">M</button><button class="woa-key woa-key--sm woa-key--sq woa-key--warn">S</button><button class="woa-key woa-key--sm woa-key--sq woa-key--cue" aria-label="PFL" data-woa-icon="phones"></button></div>
 <div class="woa-strip__fm"><div class="woa-fader" style="--v:0.6;grid-template-columns:22px;--fader-h:170px"><div class="woa-fader__track" role="slider" aria-label="Pegel Jingles"><div class="woa-fader__cap"></div></div></div><div class="woa-meter" data-ch="2" data-segs="28" data-level="0.0" style="height:170px"></div></div>
 <div class="woa-strip__name">Jingles</div>
</div></div>
<script>WOA.init();</script>
</body>
</html>
