<!-- @dsCard group="Komponieren" height=640 width=1000 subtitle="Instrument einer MIDI-Spur: eigener Abschnitt im Rack, vor den Inserts" -->
<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>WOA</title>
<style>body{padding:16px}.cap{font-family:var(--font-label);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin:0 0 6px}</style></head>
<body>

<div style="display:grid;grid-template-columns:320px 320px;gap:24px;align-items:start">
 <div><p class="cap">Zu</p><div class="woa-rk" style="--t:var(--track-3)"><div class="woa-rk__head" style="--t:var(--track-3)"><span class="woa-rk__dot"></span><span class="woa-rk__name">Akkorde</span><span class="woa-rk__kind"><span data-woa-icon="piano" style="display:contents"></span>MIDI</span><button class="woa-ib woa-ib--sm" data-woa-icon="more" data-tip="Spur-Menü"></button></div>
 <div class="woa-rk__sec"><div class="woa-rk__sh"><span class="woa-label">Eingang</span></div><div class="woa-rk__row"><span class="woa-select" role="button" data-tip="MIDI-Eingang"><span data-woa-icon="piano" style="display:contents"></span><span>Yamaha USB · alle Kanäle</span><span data-woa-icon="down" style="display:contents"></span></span></div></div>
 <div class="woa-rk__sec"><div class="woa-rk__sh"><span class="woa-label">Instrument</span></div><div class="woa-snd" style="--t:var(--track-3)"><span class="woa-snd__ic"><span data-woa-icon="cloud" style="display:contents"></span></span><div class="woa-snd__n"><b>Streicher</b><span>Pad · GeneralUser GS</span></div><button class="woa-ib woa-ib--sm" data-woa-icon="speaker" data-tip="Probeton" data-kbd="P"></button><button class="woa-ib woa-ib--sm" data-woa-icon="down" data-tip="Klang wählen"></button></div></div>
 <div class="woa-rk__sec"><div class="woa-rk__sh"><span class="woa-label">Inserts · 1</span></div><div class="woa-slot"><div class="woa-slot__bar"><span class="woa-slot__grip" data-woa-icon="grip" data-tip="Ziehen zum Umsortieren"></span><button class="woa-ib woa-ib--sm woa-slot__pw" data-woa-icon="power" data-tip="Bypass" data-kbd="B" aria-pressed="true"></button><span class="woa-slot__n">Reverb</span><button class="woa-ib woa-ib--sm woa-ib--danger woa-slot__x" data-woa-icon="x" data-tip="Entfernen" data-kbd="Entf"></button></div></div><button class="woa-add" data-woa-icon="plus">Effekt</button></div>
 <div class="woa-rk__sec"><div class="woa-rk__sh"><span class="woa-label">Ausgang</span></div><div class="woa-rk__row"><span class="woa-select" role="button" data-tip="Ausgang"><span data-woa-icon="output" style="display:contents"></span><span>Master</span><span data-woa-icon="down" style="display:contents"></span></span><span class="woa-num woa-num--s" data-tip="Panorama" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="pan" data-min="-100" data-max="100" data-step="1" data-default="0" data-value="0"><span class="woa-num__v"></span></span></div></div>
</div></div>
 <div><p class="cap">Klang wählen (aufgeklappt)</p><div class="woa-rk" style="--t:var(--track-3)"><div class="woa-rk__head" style="--t:var(--track-3)"><span class="woa-rk__dot"></span><span class="woa-rk__name">Akkorde</span><span class="woa-rk__kind"><span data-woa-icon="piano" style="display:contents"></span>MIDI</span><button class="woa-ib woa-ib--sm" data-woa-icon="more" data-tip="Spur-Menü"></button></div>
 <div class="woa-rk__sec"><div class="woa-rk__sh"><span class="woa-label">Eingang</span></div><div class="woa-rk__row"><span class="woa-select" role="button" data-tip="MIDI-Eingang"><span data-woa-icon="piano" style="display:contents"></span><span>Yamaha USB · alle Kanäle</span><span data-woa-icon="down" style="display:contents"></span></span></div></div>
 <div class="woa-rk__sec"><div class="woa-rk__sh"><span class="woa-label">Instrument</span></div><div class="woa-snd" style="--t:var(--track-3)"><span class="woa-snd__ic"><span data-woa-icon="cloud" style="display:contents"></span></span><div class="woa-snd__n"><b>Streicher</b><span>Pad · GeneralUser GS</span></div><button class="woa-ib woa-ib--sm" data-woa-icon="speaker" data-tip="Probeton" data-kbd="P"></button><button class="woa-ib woa-ib--sm" data-woa-icon="up" data-tip="Klang wählen"></button></div><div class="woa-roles"><button aria-pressed="false"><span data-woa-icon="piano" style="display:contents"></span>Lead</button><button aria-pressed="false"><span data-woa-icon="sine" style="display:contents"></span>Bass</button><button aria-pressed="true"><span data-woa-icon="cloud" style="display:contents"></span>Pad</button><button aria-pressed="false"><span data-woa-icon="grid" style="display:contents"></span>Kit</button></div>
  <div class="woa-tiles"><button class="woa-tile" aria-pressed="true">Streicher<span class="woa-ib woa-ib--sm" data-woa-icon="speaker" data-tip="Probeton"></span></button><button class="woa-tile" aria-pressed="false">Warm Pad<span class="woa-ib woa-ib--sm" data-woa-icon="speaker" data-tip="Probeton"></span></button><button class="woa-tile" aria-pressed="false">Orgel<span class="woa-ib woa-ib--sm" data-woa-icon="speaker" data-tip="Probeton"></span></button><button class="woa-tile" aria-pressed="false">Chor<span class="woa-ib woa-ib--sm" data-woa-icon="speaker" data-tip="Probeton"></span></button></div>
  <div class="woa-rk__row"><span class="woa-select" role="button" data-tip="Klangbank"><span data-woa-icon="folder" style="display:contents"></span><span>GeneralUser GS (eingebaut)</span><span data-woa-icon="down" style="display:contents"></span></span></div>
  <button class="woa-add" data-woa-icon="sine" data-tip="Ohne Klangbank" data-hint="Eingebauter Synth, lädt nichts">Eingebauter Synth</button></div>
 <div class="woa-rk__sec"><div class="woa-rk__sh"><span class="woa-label">Inserts · 1</span></div><div class="woa-slot"><div class="woa-slot__bar"><span class="woa-slot__grip" data-woa-icon="grip" data-tip="Ziehen zum Umsortieren"></span><button class="woa-ib woa-ib--sm woa-slot__pw" data-woa-icon="power" data-tip="Bypass" data-kbd="B" aria-pressed="true"></button><span class="woa-slot__n">Reverb</span><button class="woa-ib woa-ib--sm woa-ib--danger woa-slot__x" data-woa-icon="x" data-tip="Entfernen" data-kbd="Entf"></button></div></div><button class="woa-add" data-woa-icon="plus">Effekt</button></div>
 <div class="woa-rk__sec"><div class="woa-rk__sh"><span class="woa-label">Ausgang</span></div><div class="woa-rk__row"><span class="woa-select" role="button" data-tip="Ausgang"><span data-woa-icon="output" style="display:contents"></span><span>Master</span><span data-woa-icon="down" style="display:contents"></span></span><span class="woa-num woa-num--s" data-tip="Panorama" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="pan" data-min="-100" data-max="100" data-step="1" data-default="0" data-value="0"><span class="woa-num__v"></span></span></div></div>
</div></div>
</div>
<script>WOA.init();</script>
</body>
</html>
