<!-- @dsCard group="Anzeigen" height=190 subtitle="LCD-Display mit 7-Segment-Restzeit" -->
<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>WOA</title>
<style>body{padding:16px}</style></head>
<body>

<div class="woa-row" style="align-items:stretch">
 <div class="woa-lcd" style="width:340px;display:flex;flex-direction:column;gap:6px">
  <div style="display:flex;justify-content:space-between"><span class="woa-lcd__cap">Aktuell on air</span><span class="woa-lcd__cap">−14.1 LUFS</span></div>
  <div style="font-family:var(--font-ui);font-weight:600;font-size:15px">Silvester Jingle Bed – Countdown</div>
  <div style="display:flex;align-items:baseline;justify-content:space-between"><span class="woa-seg" data-ghost="88:88" style="font-size:54px"><span>03:42</span></span><span class="woa-lcd__cap">Ende <span class="woa-lcd__ink">1:12:08</span></span></div>
  <div class="woa-progress" style="--p:62%"><i></i></div>
 </div>
 <div class="woa-lcd" style="width:170px;display:flex;flex-direction:column;gap:6px">
  <span class="woa-lcd__cap">Restzeit &lt; 10 s</span>
  <span class="woa-seg is-alert is-blink" data-ghost="88:88" style="font-size:40px"><span>00:07</span></span>
  <div class="woa-progress is-alert" style="--p:96%"><i></i></div>
 </div>
</div>
<script>WOA.init();</script>
</body>
</html>
