<!-- @dsCard group="Party" height=640 width=460 subtitle="DJ-Mixer mit „Weiter · Übergang“ unter dem Crossfader (läuft: Fortschritt)" -->
<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>WOA</title>
<style>body{padding:16px}.cap{font-family:var(--font-label);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin:0 0 6px}</style></head>
<body>
<div class="woa-dj" style="max-width:420px"><div class="woa-djm"><div class="woa-djm__ch" style="--dc:var(--da)"><span class="woa-djm__lab" style="color:var(--da)">A</span>
 <div class="woa-knob" data-fmt="pct" style="--v:0.6" data-default="0.75"><div class="woa-knob__dial" role="slider" aria-label="Trim" data-tip="Eingangspegel Deck A" data-hint="Ziehen · Doppelklick = Mitte/Standard"><div class="woa-knob__cap"></div></div><span class="woa-knob__name">Trim</span></div>
 <div class="woa-knob woa-knob--center" data-fmt="eq" style="--v:0.5" data-default="0.5"><div class="woa-knob__dial" role="slider" aria-label="Hi" data-tip="Hi" data-hint="Ziehen · Doppelklick = Mitte/Standard"><div class="woa-knob__cap"></div></div><span class="woa-knob__name">Hi</span></div><div class="woa-knob woa-knob--center" data-fmt="eq" style="--v:0.5" data-default="0.5"><div class="woa-knob__dial" role="slider" aria-label="Mid" data-tip="Mid" data-hint="Ziehen · Doppelklick = Mitte/Standard"><div class="woa-knob__cap"></div></div><span class="woa-knob__name">Mid</span></div><div class="woa-knob woa-knob--center" data-fmt="eq" style="--v:0.5" data-default="0.5"><div class="woa-knob__dial" role="slider" aria-label="Lo" data-tip="Bässe (ganz links = Kill)" data-hint="Ziehen · Doppelklick = Mitte/Standard"><div class="woa-knob__cap"></div></div><span class="woa-knob__name">Lo</span></div>
 <div class="woa-knob woa-knob--center" data-fmt="pct" style="--v:0.5" data-default="0.5"><div class="woa-knob__dial" role="slider" aria-label="Filter" data-tip="Filter: links Tiefpass, rechts Hochpass" data-hint="Ziehen · Doppelklick = Mitte/Standard"><div class="woa-knob__cap"></div></div><span class="woa-knob__name">Filter</span></div>
 <button class="woa-key woa-key--cue woa-key--sq" data-woa-icon="phones" data-tip="Vorhören Deck A (Cue)" data-hint="Auf den Kopfhörer, nicht auf die Anlage"></button>
 <div class="woa-djm__fm"><div class="woa-fader" style="--v:0.78;grid-template-columns:22px;--fader-h:100px" data-default=".75"><div class="woa-fader__track" role="slider" aria-label="Kanal A"><div class="woa-fader__cap"></div></div></div><div class="woa-meter" data-ch="2" data-segs="16" data-level="0.72" style="height:100px"></div></div>
</div><div class="woa-djm__mid"><span class="woa-label" style="font-size:10px">Master</span><div class="woa-meter" data-ch="2" data-segs="16" data-level=".78" style="height:120px"></div><div class="woa-knob" data-fmt="pct" style="--v:0.72" data-default="0.75"><div class="woa-knob__dial" role="slider" aria-label="Master" data-tip="Lautstärke der Anlage" data-hint="Ziehen · Doppelklick = Mitte/Standard"><div class="woa-knob__cap"></div></div><span class="woa-knob__name">Master</span></div><span class="woa-label" style="font-size:10px;margin-top:4px">Kopfhörer</span><div class="woa-knob woa-knob--center" data-fmt="pct" style="--v:0.3" data-default="0.5"><div class="woa-knob__dial" role="slider" aria-label="Mix" data-tip="Kopfhörer: links Cue, rechts Master" data-hint="Ziehen · Doppelklick = Mitte/Standard"><div class="woa-knob__cap"></div></div><span class="woa-knob__name">Mix</span></div><div class="woa-knob" data-fmt="pct" style="--v:0.6" data-default="0.75"><div class="woa-knob__dial" role="slider" aria-label="Pegel" data-tip="Kopfhörer-Lautstärke" data-hint="Ziehen · Doppelklick = Mitte/Standard"><div class="woa-knob__cap"></div></div><span class="woa-knob__name">Pegel</span></div></div><div class="woa-djm__ch" style="--dc:var(--db)"><span class="woa-djm__lab" style="color:var(--db)">B</span>
 <div class="woa-knob" data-fmt="pct" style="--v:0.6" data-default="0.75"><div class="woa-knob__dial" role="slider" aria-label="Trim" data-tip="Eingangspegel Deck B" data-hint="Ziehen · Doppelklick = Mitte/Standard"><div class="woa-knob__cap"></div></div><span class="woa-knob__name">Trim</span></div>
 <div class="woa-knob woa-knob--center" data-fmt="eq" style="--v:0.5" data-default="0.5"><div class="woa-knob__dial" role="slider" aria-label="Hi" data-tip="Hi" data-hint="Ziehen · Doppelklick = Mitte/Standard"><div class="woa-knob__cap"></div></div><span class="woa-knob__name">Hi</span></div><div class="woa-knob woa-knob--center" data-fmt="eq" style="--v:0.5" data-default="0.5"><div class="woa-knob__dial" role="slider" aria-label="Mid" data-tip="Mid" data-hint="Ziehen · Doppelklick = Mitte/Standard"><div class="woa-knob__cap"></div></div><span class="woa-knob__name">Mid</span></div><div class="woa-knob woa-knob--center" data-fmt="eq" style="--v:0.12" data-default="0.5"><div class="woa-knob__dial" role="slider" aria-label="Lo" data-tip="Bässe (ganz links = Kill)" data-hint="Ziehen · Doppelklick = Mitte/Standard"><div class="woa-knob__cap"></div></div><span class="woa-knob__name">Lo</span></div>
 <div class="woa-knob woa-knob--center" data-fmt="pct" style="--v:0.5" data-default="0.5"><div class="woa-knob__dial" role="slider" aria-label="Filter" data-tip="Filter: links Tiefpass, rechts Hochpass" data-hint="Ziehen · Doppelklick = Mitte/Standard"><div class="woa-knob__cap"></div></div><span class="woa-knob__name">Filter</span></div>
 <button class="woa-key woa-key--cue woa-key--sq is-lit" data-woa-icon="phones" data-tip="Vorhören Deck B (Cue)" data-hint="Auf den Kopfhörer, nicht auf die Anlage"></button>
 <div class="woa-djm__fm"><div class="woa-fader" style="--v:0.7;grid-template-columns:22px;--fader-h:100px" data-default=".75"><div class="woa-fader__track" role="slider" aria-label="Kanal B"><div class="woa-fader__cap"></div></div></div><div class="woa-meter" data-ch="2" data-segs="16" data-level="0.6" style="height:100px"></div></div>
</div><div class="woa-djm__xf"><span class="woa-djm__lab" style="color:var(--da)">A</span><div class="woa-fader woa-fader--h" data-fmt="pct" style="--v:.42" data-default=".5"><div class="woa-fader__track" role="slider" aria-label="Crossfader" data-tip="Crossfader" data-hint="Doppelklick = Mitte"><div class="woa-fader__cap"></div></div></div><span class="woa-djm__lab" style="color:var(--db)">B</span></div><div class="woa-next" style="flex-direction:row;align-items:center;gap:8px"><div class="woa-segs"><button aria-pressed="true">weich</button><button aria-pressed="false">hart</button></div><button class="woa-key is-run" style="--p:35%;flex:1;height:36px;font-size:14px" data-woa-icon="fade" data-tip="Weiter · Übergang" data-kbd="Enter" data-hint="Blendet A → B über 8 Takte · läuft: noch 5,2 s">Weiter · Übergang</button></div></div></div>
<script>WOA.init();</script>
</body>
</html>
