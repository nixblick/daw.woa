<!-- @dsCard group="Party" height=700 width=480 subtitle="DJ-Mixer im Standard-Stil Mini-Fader, mit Weiter · Übergang" -->
<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>WOA</title>
<style>body{padding:16px}.cap{font-family:var(--font-label);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin:0 0 6px}</style></head>
<body>
<div class="woa-dj" style="max-width:440px" data-woa-mode="party"><div class="woa-djm" style="grid-template-columns:1fr 96px 1fr"><div class="woa-djm__ch" style="--dc:var(--da);padding:8px"><span class='woa-djm__lab' style='color:var(--da)'>A</span>
 <div class="woa-mf"><div><div class="woa-fader" style="--v:0.6;grid-template-columns:18px" data-default=".5"><div class="woa-fader__track"><div class="woa-fader__cap"></div></div></div><span>Trim</span></div><div><div class="woa-fader" style="--v:0.5;grid-template-columns:18px" data-default=".5"><div class="woa-fader__track"><div class="woa-fader__cap"></div></div></div><span>Filter</span></div></div>
 <div class="woa-mf"><div><div class="woa-fader" style="--v:0.5;grid-template-columns:18px" data-default=".5"><div class="woa-fader__track"><div class="woa-fader__cap"></div></div></div><span>Hi</span><button class="woa-kill">KILL</button></div><div><div class="woa-fader" style="--v:0.55;grid-template-columns:18px" data-default=".5"><div class="woa-fader__track"><div class="woa-fader__cap"></div></div></div><span>Mid</span><button class="woa-kill">KILL</button></div><div><div class="woa-fader" style="--v:0.5;grid-template-columns:18px" data-default=".5"><div class="woa-fader__track"><div class="woa-fader__cap"></div></div></div><span>Lo</span><button class="woa-kill">KILL</button></div></div>
 <button class="woa-key woa-key--cue woa-key--sq" data-woa-icon="phones" style="width:100%"></button><div class="woa-djm__fm"><div class="woa-fader" style="--v:0.78;grid-template-columns:22px;--fader-h:110px"><div class="woa-fader__track" role="slider" aria-label="Kanal A"><div class="woa-fader__cap"></div></div></div><div class="woa-meter" data-ch="2" data-segs="20" data-level="0.7" style="height:110px"></div></div></div><div class="woa-djm__mid"><span class="woa-label" style="font-size:10px">Master</span><div style="display:flex;gap:4px"><div class="woa-meter" data-ch="2" data-segs="22" data-level=".78" style="height:140px"></div></div><div class="woa-mf"><div><div class="woa-fader" style="--v:0.72;grid-template-columns:18px" data-default=".5"><div class="woa-fader__track"><div class="woa-fader__cap"></div></div></div><span>Master</span></div></div><span class="woa-label" style="font-size:10px">Kopfhörer</span><div class="woa-mf"><div><div class="woa-fader" style="--v:0.3;grid-template-columns:18px" data-default=".5"><div class="woa-fader__track"><div class="woa-fader__cap"></div></div></div><span>Mix</span></div><div><div class="woa-fader" style="--v:0.6;grid-template-columns:18px" data-default=".5"><div class="woa-fader__track"><div class="woa-fader__cap"></div></div></div><span>Pegel</span></div></div></div><div class="woa-djm__ch" style="--dc:var(--db);padding:8px"><span class='woa-djm__lab' style='color:var(--db)'>B</span>
 <div class="woa-mf"><div><div class="woa-fader" style="--v:0.6;grid-template-columns:18px" data-default=".5"><div class="woa-fader__track"><div class="woa-fader__cap"></div></div></div><span>Trim</span></div><div><div class="woa-fader" style="--v:0.5;grid-template-columns:18px" data-default=".5"><div class="woa-fader__track"><div class="woa-fader__cap"></div></div></div><span>Filter</span></div></div>
 <div class="woa-mf"><div><div class="woa-fader" style="--v:0.5;grid-template-columns:18px" data-default=".5"><div class="woa-fader__track"><div class="woa-fader__cap"></div></div></div><span>Hi</span><button class="woa-kill">KILL</button></div><div><div class="woa-fader" style="--v:0.55;grid-template-columns:18px" data-default=".5"><div class="woa-fader__track"><div class="woa-fader__cap"></div></div></div><span>Mid</span><button class="woa-kill">KILL</button></div><div><div class="woa-fader" style="--v:0.0;grid-template-columns:18px" data-default=".5"><div class="woa-fader__track"><div class="woa-fader__cap"></div></div></div><span>Lo</span><button class="woa-kill on">KILL</button></div></div>
 <button class="woa-key woa-key--cue woa-key--sq is-lit" data-woa-icon="phones" style="width:100%"></button><div class="woa-djm__fm"><div class="woa-fader" style="--v:0.7;grid-template-columns:22px;--fader-h:110px"><div class="woa-fader__track" role="slider" aria-label="Kanal B"><div class="woa-fader__cap"></div></div></div><div class="woa-meter" data-ch="2" data-segs="20" data-level="0.6" style="height:110px"></div></div></div><div class="woa-djm__xf"><span class="woa-djm__lab" style="color:var(--da)">A</span><div class="woa-fader woa-fader--h" style="--v:.42"><div class="woa-fader__track"><div class="woa-fader__cap"></div></div></div><span class="woa-djm__lab" style="color:var(--db)">B</span></div><div class="woa-next" style="flex-direction:row;align-items:center;gap:8px"><div class="woa-segs"><button aria-pressed="true">weich</button><button aria-pressed="false">hart</button></div><button class="woa-key is-run" style="--p:35%;flex:1;height:36px;font-size:14px" data-woa-icon="fade" data-tip="Weiter · Übergang" data-kbd="Enter" data-hint="Blendet A → B über 8 Takte · läuft: noch 5,2 s">Weiter · Übergang</button></div></div></div>
<script>WOA.init();</script>
</body>
</html>
