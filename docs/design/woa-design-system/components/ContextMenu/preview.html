<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>WOA</title>
<style>body{padding:16px}.cap{font-family:var(--font-label);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin:0 0 6px}</style></head>
<body>

<div style="display:grid;grid-template-columns:repeat(3,260px);gap:28px;align-items:start">
 <div><p class="cap">Spurkopf</p><div class="woa-pop"><div class="woa-pop__i"><span data-woa-icon="rename" style="display:contents"></span><span>Umbenennen</span><span class="woa-pop__k">F2</span></div><div class="woa-pop__i"><span data-woa-icon="palette" style="display:contents"></span><span>Farbe</span><span class="woa-pop__k"></span></div><div class="woa-pop__i"><span data-woa-icon="copy" style="display:contents"></span><span>Duplizieren</span><span class="woa-pop__k">Strg+D</span></div><div class="woa-pop__sep"></div><div class="woa-pop__i"><span data-woa-icon="rec" style="display:contents"></span><span>Aufnahme scharf</span><span class="woa-pop__k">Umschalt+R</span></div><div class="woa-pop__i"><span data-woa-icon="eq" style="display:contents"></span><span>Insert-Rack zeigen</span><span class="woa-pop__k"></span></div><div class="woa-pop__sep"></div><div class="woa-pop__i is-danger"><span data-woa-icon="trash" style="display:contents"></span><span>Spur löschen</span><span class="woa-pop__k">Entf</span></div></div></div>
 <div><p class="cap">Kanalzug</p><div class="woa-pop"><div class="woa-pop__i"><span data-woa-icon="rename" style="display:contents"></span><span>Umbenennen</span><span class="woa-pop__k">F2</span></div><div class="woa-pop__i"><span data-woa-icon="palette" style="display:contents"></span><span>Farbe</span><span class="woa-pop__k"></span></div><div class="woa-pop__i"><span data-woa-icon="output" style="display:contents"></span><span>Ausgang</span><span class="woa-pop__k"></span></div><div class="woa-pop__i"><span data-woa-icon="send" style="display:contents"></span><span>Send hinzufügen</span><span class="woa-pop__k"></span></div><div class="woa-pop__sep"></div><div class="woa-pop__i"><span data-woa-icon="eq" style="display:contents"></span><span>Insert-Rack zeigen</span><span class="woa-pop__k"></span></div><div class="woa-pop__sep"></div><div class="woa-pop__i is-danger"><span data-woa-icon="trash" style="display:contents"></span><span>Spur löschen</span><span class="woa-pop__k">Entf</span></div></div></div>
 <div><p class="cap">Clip</p><div class="woa-pop"><div class="woa-pop__i is-hover"><span data-woa-icon="cut" style="display:contents"></span><span>Teilen</span><span class="woa-pop__k">S</span></div><div class="woa-pop__i"><span data-woa-icon="copy" style="display:contents"></span><span>Duplizieren</span><span class="woa-pop__k">Strg+D</span></div><div class="woa-pop__i"><span data-woa-icon="reverse" style="display:contents"></span><span>Umkehren</span><span class="woa-pop__k">R</span></div><div class="woa-pop__i"><span data-woa-icon="normalize" style="display:contents"></span><span>Normalisieren</span><span class="woa-pop__k"></span></div><div class="woa-pop__i"><span data-woa-icon="mute" style="display:contents"></span><span>Stumm</span><span class="woa-pop__k">0</span></div><div class="woa-pop__sep"></div><div class="woa-pop__i is-off"><span data-woa-icon="merge" style="display:contents"></span><span>Zusammenfügen</span><span class="woa-pop__k">Strg+J</span></div><div class="woa-pop__sep"></div><div class="woa-pop__i is-danger"><span data-woa-icon="trash" style="display:contents"></span><span>Löschen</span><span class="woa-pop__k">Entf</span></div></div></div>
</div>
<script>WOA.init();</script>
</body>
</html>
