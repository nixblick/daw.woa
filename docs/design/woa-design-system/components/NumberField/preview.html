<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>WOA</title>
<style>body{padding:16px}.cap{font-family:var(--font-label);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin:0 0 6px}</style></head>
<body>

<div class="woa-col" style="gap:14px">
 <div class="woa-row" style="gap:18px"><span class="cap" style="width:90px;margin:0">Breiten</span><span class="woa-num woa-num--s" data-tip="Pan (S 52 px)" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="pan" data-min="-100" data-max="100" data-step="1" data-default="0" data-value="0"><span class="woa-num__v"></span></span><span class="woa-num" data-tip="Gain (64 px)" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="db" data-min="-60" data-max="12" data-step="0.1" data-default="0" data-value="-3.0"><span class="woa-num__v"></span><span class=woa-num__u>dB</span></span><span class="woa-num woa-num--m" data-woa-icon="fadein" data-tip="Fade-In (M 84 px)" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="int" data-min="0" data-max="10000" data-step="10" data-default="0" data-value="120"><span class="woa-num__v"></span><span class=woa-num__u>ms</span></span><span class="woa-num woa-num--l" data-tip="Position (L 104 px)" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fixed data-fmt="int" data-min="-60" data-max="12" data-step="0.1" data-default="0" data-value="12.3.2"><span class="woa-num__u">Start</span><span class="woa-num__v">12.3.2</span></span></div>
 <div class="woa-row" style="gap:18px"><span class="cap" style="width:90px;margin:0">Einheiten</span><span class="woa-num" data-tip="Dezibel" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="db" data-min="-60" data-max="12" data-step="0.1" data-default="0" data-value="-6.0"><span class="woa-num__v"></span><span class=woa-num__u>dB</span></span><span class="woa-num" data-tip="Prozent" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="pct" data-min="0" data-max="100" data-step="1" data-default="100" data-value="75"><span class="woa-num__v"></span><span class=woa-num__u>%</span></span><span class="woa-num woa-num--s" data-tip="Halbtöne" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="st" data-min="-24" data-max="24" data-step="1" data-default="0" data-value="-2"><span class="woa-num__v"></span><span class=woa-num__u>st</span></span><span class="woa-num woa-num--m" data-tip="Millisekunden" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="int" data-min="0" data-max="5000" data-step="10" data-default="0" data-value="250"><span class="woa-num__v"></span><span class=woa-num__u>ms</span></span><span class="woa-num woa-num--s" data-tip="Pan: C, L1–L100, R1–R100" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="pan" data-min="-100" data-max="100" data-step="1" data-default="0" data-value="20"><span class="woa-num__v"></span></span></div>
 <div class="woa-row" style="gap:18px"><span class="cap" style="width:90px;margin:0">Zustände</span><span class="woa-num" data-fixed style="border-color:var(--text-dim)"><span class="woa-num__v">−3.0</span><span class="woa-num__u">dB</span></span><span class="woa-num is-drag" data-fixed><span class="woa-num__v">−4.2</span><span class="woa-num__u">dB</span></span><span class="woa-num is-edit" data-fixed><span class="woa-num__v">-4,5|</span><span class="woa-num__u">dB</span></span><span class="woa-num is-mixed" data-tip="unterschiedliche Werte" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="db" data-min="-60" data-max="12" data-step="0.1" data-default="0" data-value="0"><span class="woa-num__v">—</span><span class=woa-num__u>dB</span></span><span class="woa-dim" style="font-size:12px">Hover · Ziehen · Eintippen · gemischt</span></div>
 <div class="woa-row" style="gap:18px"><span class="cap" style="width:90px;margin:0">Auswahl</span><span class="woa-select" role="button" data-tip="Eingang" style="width:160px"><span data-woa-icon="mic" style="display:contents"></span><span>In 1 · Mikro</span><span data-woa-icon="down" style="display:contents"></span></span><span class="woa-select" role="button" data-tip="Ausgang" style="width:120px"><span data-woa-icon="output" style="display:contents"></span><span>Master</span><span data-woa-icon="down" style="display:contents"></span></span><span class="woa-select" role="button" data-tip="Raster" style="width:84px"><span data-woa-icon="quantize" style="display:contents"></span><span>1/16</span><span data-woa-icon="down" style="display:contents"></span></span></div>
</div>
<script>WOA.init();</script>
</body>
</html>
