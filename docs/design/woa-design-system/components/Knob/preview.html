<!-- @dsCard group="Bedienelemente" height=130 subtitle="Drehregler mit LED-Kranz, ziehen / Pfeiltasten" -->
<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>WOA</title>
<style>body{padding:16px}</style></head>
<body>

<div class="woa-row" style="gap:12px">
 <div class="woa-knob" data-fmt="db" style="--v:.75" data-default=".75"><div class="woa-knob__dial" role="slider" aria-label="Gain"><div class="woa-knob__cap"></div></div><span class="woa-knob__val"></span><span class="woa-knob__name">Gain</span></div>
 <div class="woa-knob woa-knob--center" data-fmt="eq" style="--v:.68"><div class="woa-knob__dial" role="slider" aria-label="Höhen"><div class="woa-knob__cap"></div></div><span class="woa-knob__val"></span><span class="woa-knob__name">Hi</span></div>
 <div class="woa-knob woa-knob--center" data-fmt="eq" style="--v:.5"><div class="woa-knob__dial" role="slider" aria-label="Mitten"><div class="woa-knob__cap"></div></div><span class="woa-knob__val"></span><span class="woa-knob__name">Mid</span></div>
 <div class="woa-knob woa-knob--center" data-fmt="eq" style="--v:.3"><div class="woa-knob__dial" role="slider" aria-label="Bässe"><div class="woa-knob__cap"></div></div><span class="woa-knob__val"></span><span class="woa-knob__name">Lo</span></div>
 <div class="woa-knob woa-knob--center" data-fmt="pan" style="--v:.4"><div class="woa-knob__dial" role="slider" aria-label="Panorama"><div class="woa-knob__cap"></div></div><span class="woa-knob__val"></span><span class="woa-knob__name">Pan</span></div>
 <div class="woa-knob woa-knob--sm" data-fmt="pct" style="--v:.35"><div class="woa-knob__dial" role="slider" aria-label="Send A"><div class="woa-knob__cap"></div></div><span class="woa-knob__val"></span><span class="woa-knob__name">Send A</span></div>
</div>
<script>WOA.init();</script>
</body>
</html>
