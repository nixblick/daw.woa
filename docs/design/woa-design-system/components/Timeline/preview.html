<!-- @dsCard group="Produzent" height=330 subtitle="Arrangement: Spurköpfe, Clips, Auswahl, Playhead" -->
<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>WOA</title>
<style>body{padding:16px}.cap{font-family:var(--font-label);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin:0 0 6px}</style></head>
<body>
<div class="woa-card"><div class="woa-arr" style="grid-template-columns:260px minmax(0,1fr)"><div class="woa-ruler" style="border-right:1px solid var(--border);padding:5px 10px;display:flex;align-items:center;gap:6px"><span class="woa-label" style="flex:1">Spuren</span><button class="woa-ib woa-ib--sm" data-woa-icon="plus" data-tip="Spur anlegen" data-kbd="Strg+T"></button></div><div class="woa-ruler"><span style="left:4px">1</span><span style="left:104px">2</span><span style="left:204px">3</span><span style="left:304px">4</span><span style="left:404px">5</span><span style="left:504px">6</span><span style="left:604px">7</span></div><div class="woa-tk" style="--t:var(--track-1)">
 <div class="woa-tk__r1"><button class="woa-arm" aria-pressed="false" data-woa-icon="rec" data-tip="Aufnahme scharf" data-kbd="Umschalt+R"></button><span class="woa-tk__n" data-tip="Umbenennen" data-hint="Doppelklick">Bett-Musik</span><button class="woa-key woa-key--sm woa-key--sq woa-key--rec" data-tip="Stumm" data-kbd="M">M</button><button class="woa-key woa-key--sm woa-key--sq woa-key--warn" data-tip="Solo" data-kbd="S">S</button><button class="woa-ib woa-ib--sm woa-ib--danger woa-tk__del" data-woa-icon="trash" data-tip="Spur löschen" data-kbd="Entf" data-hint="Rückgängig mit Strg+Z"></button></div>
 <div class="woa-tk__r2"><span class="woa-select" role="button" data-tip="Eingang"><span data-woa-icon="mic" style="display:contents"></span><span>Datei</span><span data-woa-icon="down" style="display:contents"></span></span><span class="woa-num" data-tip="Pegel (= Fader)" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="db" data-min="-60" data-max="6" data-step="0.1" data-default="0" data-value="-3.0"><span class="woa-num__v"></span><span class=woa-num__u>dB</span></span><span class="woa-num woa-num--s" data-tip="Panorama" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="pan" data-min="-100" data-max="100" data-step="1" data-default="0" data-value="0"><span class="woa-num__v"></span></span></div>
 <div class="woa-meter" data-ch="2" data-segs="16" data-level="0.6"></div>
</div><div class="woa-lane" style="--t:var(--track-1)"><div class="woa-clip" style="left:0px;width:520px;--t:var(--track-1)"><div class="woa-clip__h">Bed Silvester 128 BPM</div><canvas data-woa-wave data-seed="3" data-played="1" data-color="--track-1" data-step="2"></canvas></div><div class=woa-playhead style=left:278px></div></div><div class="woa-tk is-sel-track" style="--t:var(--track-4)">
 <div class="woa-tk__r1"><button class="woa-arm" aria-pressed="false" data-woa-icon="rec" data-tip="Aufnahme scharf" data-kbd="Umschalt+R"></button><span class="woa-tk__n" data-tip="Umbenennen" data-hint="Doppelklick">Jingle-Stimme</span><button class="woa-key woa-key--sm woa-key--sq woa-key--rec" data-tip="Stumm" data-kbd="M">M</button><button class="woa-key woa-key--sm woa-key--sq woa-key--warn" data-tip="Solo" data-kbd="S">S</button><button class="woa-ib woa-ib--sm woa-ib--danger woa-tk__del" data-woa-icon="trash" data-tip="Spur löschen" data-kbd="Entf" data-hint="Rückgängig mit Strg+Z"></button></div>
 <div class="woa-tk__r2"><span class="woa-select" role="button" data-tip="Eingang"><span data-woa-icon="mic" style="display:contents"></span><span>In 1 · Mikro</span><span data-woa-icon="down" style="display:contents"></span></span><span class="woa-num" data-tip="Pegel (= Fader)" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="db" data-min="-60" data-max="6" data-step="0.1" data-default="0" data-value="0.0"><span class="woa-num__v"></span><span class=woa-num__u>dB</span></span><span class="woa-num woa-num--s" data-tip="Panorama" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="pan" data-min="-100" data-max="100" data-step="1" data-default="0" data-value="0"><span class="woa-num__v"></span></span></div>
 <div class="woa-meter" data-ch="2" data-segs="16" data-level="0.6"></div>
</div><div class="woa-lane is-sel-track" style="--t:var(--track-4)"><div class="woa-clip" style="left:10px;width:180px;--t:var(--track-4)"><div class="woa-clip__h">Sprecher Take 3</div><canvas data-woa-wave data-seed="11" data-played="1" data-color="--track-4" data-step="2"></canvas></div><div class="woa-clip is-sel" style="left:220px;width:150px;--t:var(--track-4)"><div class="woa-clip__h">Sprecher Take 4</div><canvas data-woa-wave data-seed="5" data-played="1" data-color="--track-4" data-step="2"></canvas></div></div><div class="woa-tk is-armed" style="--t:var(--track-3)">
 <div class="woa-tk__r1"><button class="woa-arm" aria-pressed="true" data-woa-icon="rec" data-tip="Aufnahme scharf" data-kbd="Umschalt+R"></button><span class="woa-tk__n" data-tip="Umbenennen" data-hint="Doppelklick">Synth Pad</span><button class="woa-key woa-key--sm woa-key--sq woa-key--rec" data-tip="Stumm" data-kbd="M">M</button><button class="woa-key woa-key--sm woa-key--sq woa-key--warn" data-tip="Solo" data-kbd="S">S</button><button class="woa-ib woa-ib--sm woa-ib--danger woa-tk__del" data-woa-icon="trash" data-tip="Spur löschen" data-kbd="Entf" data-hint="Rückgängig mit Strg+Z"></button></div>
 <div class="woa-tk__r2"><span class="woa-select" role="button" data-tip="Eingang"><span data-woa-icon="piano" style="display:contents"></span><span>Yamaha USB</span><span data-woa-icon="down" style="display:contents"></span></span><span class="woa-num" data-tip="Pegel (= Fader)" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="db" data-min="-60" data-max="6" data-step="0.1" data-default="0" data-value="-6.0"><span class="woa-num__v"></span><span class=woa-num__u>dB</span></span><span class="woa-num woa-num--s" data-tip="Panorama" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="pan" data-min="-100" data-max="100" data-step="1" data-default="0" data-value="15"><span class="woa-num__v"></span></span></div>
 <div class="woa-meter" data-ch="2" data-segs="16" data-level="0.6"></div>
</div><div class="woa-lane" style="--t:var(--track-3)"><div class="woa-clip" style="left:100px;width:300px;--t:var(--track-3)"><div class="woa-clip__h">Pad Am – F – C – G</div><i style="position:absolute;left:6px;top:20px;width:14px;height:4px;border-radius:1px;background:var(--track-3)"></i><i style="position:absolute;left:43px;top:33px;width:21px;height:4px;border-radius:1px;background:var(--track-3)"></i><i style="position:absolute;left:80px;top:46px;width:28px;height:4px;border-radius:1px;background:var(--track-3)"></i><i style="position:absolute;left:117px;top:25px;width:35px;height:4px;border-radius:1px;background:var(--track-3)"></i><i style="position:absolute;left:154px;top:38px;width:20px;height:4px;border-radius:1px;background:var(--track-3)"></i><i style="position:absolute;left:191px;top:51px;width:27px;height:4px;border-radius:1px;background:var(--track-3)"></i><i style="position:absolute;left:228px;top:30px;width:34px;height:4px;border-radius:1px;background:var(--track-3)"></i><i style="position:absolute;left:265px;top:43px;width:19px;height:4px;border-radius:1px;background:var(--track-3)"></i><i style="position:absolute;left:22px;top:22px;width:26px;height:4px;border-radius:1px;background:var(--track-3)"></i><i style="position:absolute;left:59px;top:35px;width:33px;height:4px;border-radius:1px;background:var(--track-3)"></i></div></div><div class="woa-tk" style="--t:var(--track-2)">
 <div class="woa-tk__r1"><button class="woa-arm" aria-pressed="false" data-woa-icon="rec" data-tip="Aufnahme scharf" data-kbd="Umschalt+R"></button><span class="woa-tk__n" data-tip="Umbenennen" data-hint="Doppelklick">Drums</span><button class="woa-key woa-key--sm woa-key--sq woa-key--rec" data-tip="Stumm" data-kbd="M">M</button><button class="woa-key woa-key--sm woa-key--sq woa-key--warn" data-tip="Solo" data-kbd="S">S</button><button class="woa-ib woa-ib--sm woa-ib--danger woa-tk__del" data-woa-icon="trash" data-tip="Spur löschen" data-kbd="Entf" data-hint="Rückgängig mit Strg+Z"></button></div>
 <div class="woa-tk__r2"><span class="woa-select" role="button" data-tip="Eingang"><span data-woa-icon="mic" style="display:contents"></span><span>Datei</span><span data-woa-icon="down" style="display:contents"></span></span><span class="woa-num" data-tip="Pegel (= Fader)" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="db" data-min="-60" data-max="6" data-step="0.1" data-default="0" data-value="-2.0"><span class="woa-num__v"></span><span class=woa-num__u>dB</span></span><span class="woa-num woa-num--s" data-tip="Panorama" data-hint="Ziehen · Doppelklick = Standard · Klick = eintippen" data-fmt="pan" data-min="-100" data-max="100" data-step="1" data-default="0" data-value="0"><span class="woa-num__v"></span></span></div>
 <div class="woa-meter" data-ch="2" data-segs="16" data-level="0.6"></div>
</div><div class="woa-lane" style="--t:var(--track-2)"><div class="woa-clip" style="left:0px;width:200px;--t:var(--track-2)"><div class="woa-clip__h">Kick + Clap</div><canvas data-woa-wave data-seed="9" data-played="1" data-color="--track-2" data-step="2"></canvas></div><div class="woa-clip" style="left:200px;width:200px;--t:var(--track-2)"><div class="woa-clip__h">Kick + Clap</div><canvas data-woa-wave data-seed="9" data-played="1" data-color="--track-2" data-step="2"></canvas></div><div class="woa-clip" style="left:400px;width:200px;--t:var(--track-2)"><div class="woa-clip__h">Fill</div><canvas data-woa-wave data-seed="13" data-played="1" data-color="--track-2" data-step="2"></canvas></div></div></div></div>
<script>WOA.init();</script>
</body>
</html>
