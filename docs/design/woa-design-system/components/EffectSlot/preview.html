<!-- @dsCard group="Produzent" height=560 subtitle="Slots: an, Bypass, aufgeklappt, Umsortieren, Plugin, laden, Fehler" -->
<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>WOA</title>
<style>body{padding:16px}.cap{font-family:var(--font-label);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin:0 0 6px}</style></head>
<body>

<div style="display:grid;grid-template-columns:300px 300px;gap:28px;align-items:start">
 <div class="woa-col" style="gap:6px">
  <p class="cap">Eingebaute Effekte</p>
  <div class="woa-slot"><div class="woa-slot__bar"><span class="woa-slot__grip" data-woa-icon="grip" data-tip="Ziehen zum Umsortieren"></span><button class="woa-ib woa-ib--sm woa-slot__pw" data-woa-icon="power" data-tip="Bypass" data-kbd="B" aria-pressed="true"></button><span class="woa-slot__n">EQ</span><button class="woa-ib woa-ib--sm woa-ib--danger woa-slot__x" data-woa-icon="x" data-tip="Entfernen" data-kbd="Entf"></button></div><div class="woa-slot__p"><span class="woa-field"><span class="woa-field__l">Lo</span><span class="woa-num" data-fmt="db" data-min="-15" data-max="15" data-step="0.1" data-default="0" data-value="-2.0"><span class="woa-num__v"></span><span class=woa-num__u>dB</span></span></span><span class="woa-field"><span class="woa-field__l">Mid</span><span class="woa-num" data-fmt="db" data-min="-15" data-max="15" data-step="0.1" data-default="0" data-value="1.5"><span class="woa-num__v"></span><span class=woa-num__u>dB</span></span></span><span class="woa-field"><span class="woa-field__l">Hi</span><span class="woa-num" data-fmt="db" data-min="-15" data-max="15" data-step="0.1" data-default="0" data-value="3.0"><span class="woa-num__v"></span><span class=woa-num__u>dB</span></span></span></div></div>
  <div class="woa-slot"><div class="woa-slot__bar"><span class="woa-slot__grip" data-woa-icon="grip" data-tip="Ziehen zum Umsortieren"></span><button class="woa-ib woa-ib--sm woa-slot__pw" data-woa-icon="power" data-tip="Bypass" data-kbd="B" aria-pressed="true"></button><span class="woa-slot__n">Kompressor</span><button class="woa-ib woa-ib--sm woa-ib--danger woa-slot__x" data-woa-icon="x" data-tip="Entfernen" data-kbd="Entf"></button></div></div>
  <div class="woa-slot is-bypass"><div class="woa-slot__bar"><span class="woa-slot__grip" data-woa-icon="grip" data-tip="Ziehen zum Umsortieren"></span><button class="woa-ib woa-ib--sm woa-slot__pw" data-woa-icon="power" data-tip="Einschalten" data-kbd="B" aria-pressed="false"></button><span class="woa-slot__n">De-Esser</span><button class="woa-ib woa-ib--sm woa-ib--danger woa-slot__x" data-woa-icon="x" data-tip="Entfernen" data-kbd="Entf"></button></div></div>
  <p class="cap" style="margin-top:12px">Umsortieren (ziehen)</p>
  <div class="woa-slot is-ghost"><div class="woa-slot__bar"><span class="woa-slot__grip" data-woa-icon="grip" data-tip="Ziehen zum Umsortieren"></span><button class="woa-ib woa-ib--sm woa-slot__pw" data-woa-icon="power" data-tip="Bypass" data-kbd="B" aria-pressed="true"></button><span class="woa-slot__n">Kompressor</span><button class="woa-ib woa-ib--sm woa-ib--danger woa-slot__x" data-woa-icon="x" data-tip="Entfernen" data-kbd="Entf"></button></div></div>
  <div class="woa-slot"><div class="woa-slot__bar"><span class="woa-slot__grip" data-woa-icon="grip" data-tip="Ziehen zum Umsortieren"></span><button class="woa-ib woa-ib--sm woa-slot__pw" data-woa-icon="power" data-tip="Bypass" data-kbd="B" aria-pressed="true"></button><span class="woa-slot__n">Reverb</span><button class="woa-ib woa-ib--sm woa-ib--danger woa-slot__x" data-woa-icon="x" data-tip="Entfernen" data-kbd="Entf"></button></div></div>
  <div class="woa-drop"></div>
  <div class="woa-slot is-drag"><div class="woa-slot__bar"><span class="woa-slot__grip" data-woa-icon="grip" data-tip="Ziehen zum Umsortieren"></span><button class="woa-ib woa-ib--sm woa-slot__pw" data-woa-icon="power" data-tip="Bypass" data-kbd="B" aria-pressed="true"></button><span class="woa-slot__n">Kompressor</span><button class="woa-ib woa-ib--sm woa-ib--danger woa-slot__x" data-woa-icon="x" data-tip="Entfernen" data-kbd="Entf"></button></div></div>
 </div>
 <div class="woa-col" style="gap:6px">
  <p class="cap">Plugins</p>
  <div class="woa-slot"><div class="woa-slot__bar"><span class="woa-slot__grip" data-woa-icon="grip" data-tip="Ziehen zum Umsortieren"></span><button class="woa-ib woa-ib--sm woa-slot__pw" data-woa-icon="power" data-tip="Bypass" data-kbd="B" aria-pressed="true"></button><span class="woa-slot__n">Surge XT<small>CLAP</small></span><button class="woa-ib woa-ib--sm" data-woa-icon="open" data-tip="Fenster öffnen" aria-pressed="false"></button><button class="woa-ib woa-ib--sm woa-ib--danger woa-slot__x" data-woa-icon="x" data-tip="Entfernen" data-kbd="Entf"></button></div></div>
  <div class="woa-slot"><div class="woa-slot__bar"><span class="woa-slot__grip" data-woa-icon="grip" data-tip="Ziehen zum Umsortieren"></span><button class="woa-ib woa-ib--sm woa-slot__pw" data-woa-icon="power" data-tip="Bypass" data-kbd="B" aria-pressed="true"></button><span class="woa-slot__n">Vital<small>CLAP</small></span><button class="woa-ib woa-ib--sm" data-woa-icon="open" data-tip="Fenster schließen" aria-pressed="true"></button><button class="woa-ib woa-ib--sm woa-ib--danger woa-slot__x" data-woa-icon="x" data-tip="Entfernen" data-kbd="Entf"></button></div></div>
  <div class="woa-slot is-loading"><div class="woa-slot__bar"><span class="woa-slot__grip" data-woa-icon="grip"></span><span class="woa-ib woa-ib--sm" style="pointer-events:none"><span class="woa-spin"></span></span><span class="woa-slot__n">Dexed <small>CLAP</small></span></div></div>
  <div class="woa-slot is-error"><div class="woa-slot__bar"><span class="woa-slot__grip" data-woa-icon="grip"></span><span class="woa-ib woa-ib--sm" style="color:var(--on-air)" data-woa-icon="warning"></span><span class="woa-slot__n">Odin 2 <small>CLAP</small></span><button class="woa-ib woa-ib--sm" data-woa-icon="reload" data-tip="Neu laden"></button><button class="woa-ib woa-ib--sm woa-ib--danger woa-slot__x" data-woa-icon="x" data-tip="Entfernen" data-kbd="Entf"></button></div><div class="woa-slot__msg">Abgestürzt – Spur läuft ohne Plugin weiter.</div></div>
  <div class="woa-slot is-error"><div class="woa-slot__bar"><span class="woa-slot__grip" data-woa-icon="grip"></span><span class="woa-ib woa-ib--sm" style="color:var(--on-air)" data-woa-icon="warning"></span><span class="woa-slot__n">Pro-Q 3 <small>VST3</small></span><button class="woa-ib woa-ib--sm" data-woa-icon="folder" data-tip="Plugin suchen"></button><button class="woa-ib woa-ib--sm woa-ib--danger woa-slot__x" data-woa-icon="x" data-tip="Entfernen" data-kbd="Entf"></button></div><div class="woa-slot__msg">Nicht gefunden – Einstellungen bleiben erhalten.</div></div>
  <button class="woa-add" data-woa-icon="plus">Effekt</button>
 </div>
</div>
<script>WOA.init();</script>
</body>
</html>
