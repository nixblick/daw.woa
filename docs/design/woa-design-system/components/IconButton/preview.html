<!-- @dsCard group="Bedienelemente" height=250 subtitle="Knopf nur mit Symbol: Größen, Zustände, Gefahr – immer mit Tooltip" -->
<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>WOA</title>
<style>body{padding:16px}.cap{font-family:var(--font-label);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin:0 0 6px}</style></head>
<body>

<div class="woa-col" style="gap:14px">
 <div class="woa-row" style="gap:18px"><span class="cap" style="width:90px;margin:0">Größen</span><button class="woa-ib woa-ib--sm" data-woa-icon="cut" data-tip="Teilen" data-kbd="S"></button><button class="woa-ib " data-woa-icon="cut" data-tip="Teilen" data-kbd="S"></button><button class="woa-ib woa-ib--lg" data-woa-icon="cut" data-tip="Teilen" data-kbd="S"></button><span class="woa-dim" style="font-size:12px">24 · 28 · 32 px, Symbol 14 · 16 · 18</span></div>
 <div class="woa-row" style="gap:18px"><span class="cap" style="width:90px;margin:0">Zustände</span><button class="woa-ib " data-woa-icon="copy" data-tip="Duplizieren" data-kbd="Strg+D"></button><button class="woa-ib" style="background:var(--surface);border-color:var(--border);color:var(--text)" data-woa-icon="copy" data-tip="Hover"></button><button class="woa-ib " data-woa-icon="loop" data-tip="Loop" data-kbd="L" aria-pressed="true"></button><button class="woa-ib" disabled data-woa-icon="merge" data-tip="Zusammenfügen"></button><span class="woa-dim" style="font-size:12px">ruhig · Hover · an (aria-pressed) · nicht verfügbar</span></div>
 <div class="woa-row" style="gap:18px"><span class="cap" style="width:90px;margin:0">Gefahr</span><button class="woa-ib woa-ib--danger" data-woa-icon="trash" data-tip="Löschen" data-kbd="Entf"></button><button class="woa-ib woa-ib--danger" style="background:color-mix(in srgb,var(--on-air) 16%,var(--panel));border-color:var(--on-air);color:var(--on-air)" data-woa-icon="trash" data-tip="Löschen" data-kbd="Entf"></button><span class="woa-dim" style="font-size:12px">rot erst bei Hover · immer ganz rechts der Gruppe</span></div>
 <div class="woa-row" style="gap:18px"><span class="cap" style="width:90px;margin:0">Fest</span><button class="woa-ib woa-ib--solid" data-woa-icon="folder" data-tip="Öffnen" data-kbd="Strg+O"></button><button class="woa-ib woa-ib--solid" data-woa-icon="plus" data-tip="Spur anlegen" data-kbd="Strg+T"></button><span class="woa-dim" style="font-size:12px">mit Tastenkappe, wo er allein steht (z. B. Leer-Zustand)</span></div>
</div>
<script>WOA.init();</script>
</body>
</html>
