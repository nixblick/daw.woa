<!-- @dsCard group="Produzent" height=330 subtitle="Mixer: Spuren · Busse · „+ Bus“ · Master; fx-Zahl am Kanalzug" -->
<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>WOA</title>
<style>body{padding:16px}.cap{font-family:var(--font-label);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin:0 0 6px}</style></head>
<body>

<div class="woa-row" style="align-items:stretch;gap:8px">
 <div class="woa-strip is-sel-track" style="--t:var(--track-4)">
 <div class="woa-keys"><button class="woa-key woa-key--sm woa-key--sq woa-key--rec" data-tip="Stumm" data-kbd="M">M</button><button class="woa-key woa-key--sm woa-key--sq woa-key--warn" data-tip="Solo" data-kbd="S">S</button><button class="woa-key woa-key--sm woa-key--sq woa-key--cue" data-woa-icon="phones" data-tip="Vorhören (PFL)"></button></div>
 <button class="woa-fx" data-tip="Effekte" data-hint="Öffnet das Insert-Rack dieser Spur">fx 3</button>
 <div class="woa-strip__fm"><div class="woa-fader" style="--v:0.75;grid-template-columns:22px;--fader-h:150px"><div class="woa-fader__track" role="slider" aria-label="Pegel Stimme"><div class="woa-fader__cap"></div></div></div><div class="woa-meter" data-ch="2" data-segs="26" data-level="0.62" style="height:150px"></div></div>
 <div class="woa-strip__name">Stimme</div>
</div><div class="woa-strip" style="--t:var(--track-1)">
 <div class="woa-keys"><button class="woa-key woa-key--sm woa-key--sq woa-key--rec" data-tip="Stumm" data-kbd="M">M</button><button class="woa-key woa-key--sm woa-key--sq woa-key--warn" data-tip="Solo" data-kbd="S">S</button><button class="woa-key woa-key--sm woa-key--sq woa-key--cue" data-woa-icon="phones" data-tip="Vorhören (PFL)"></button></div>
 <button class="woa-fx is-zero" data-tip="Effekte" data-hint="Öffnet das Insert-Rack dieser Spur">fx 0</button>
 <div class="woa-strip__fm"><div class="woa-fader" style="--v:0.7;grid-template-columns:22px;--fader-h:150px"><div class="woa-fader__track" role="slider" aria-label="Pegel Bed"><div class="woa-fader__cap"></div></div></div><div class="woa-meter" data-ch="2" data-segs="26" data-level="0.7" style="height:150px"></div></div>
 <div class="woa-strip__name">Bed</div>
</div><div class="woa-strip" style="--t:var(--track-3)">
 <div class="woa-keys"><button class="woa-key woa-key--sm woa-key--sq woa-key--rec" data-tip="Stumm" data-kbd="M">M</button><button class="woa-key woa-key--sm woa-key--sq woa-key--warn" data-tip="Solo" data-kbd="S">S</button><button class="woa-key woa-key--sm woa-key--sq woa-key--cue" data-woa-icon="phones" data-tip="Vorhören (PFL)"></button></div>
 <button class="woa-fx has-error" data-tip="Plugin-Fehler" data-hint="Öffnet das Insert-Rack dieser Spur"><span data-woa-icon="warning" style="display:contents"></span>fx 1</button>
 <div class="woa-strip__fm"><div class="woa-fader" style="--v:0.62;grid-template-columns:22px;--fader-h:150px"><div class="woa-fader__track" role="slider" aria-label="Pegel Pad"><div class="woa-fader__cap"></div></div></div><div class="woa-meter" data-ch="2" data-segs="26" data-level="0.5" style="height:150px"></div></div>
 <div class="woa-strip__name">Pad</div>
</div>
 <div class="woa-mixsep"></div>
 <div class="woa-strip" style="--t:var(--track-5)">
 <div class="woa-keys"><button class="woa-key woa-key--sm woa-key--sq woa-key--rec" data-tip="Stumm" data-kbd="M">M</button><button class="woa-key woa-key--sm woa-key--sq woa-key--warn" data-tip="Solo" data-kbd="S">S</button><button class="woa-key woa-key--sm woa-key--sq woa-key--cue" data-woa-icon="phones" data-tip="Vorhören (PFL)"></button></div>
 <button class="woa-fx" data-tip="Effekte" data-hint="Öffnet das Insert-Rack dieser Spur">fx 1</button>
 <div class="woa-strip__fm"><div class="woa-fader" style="--v:0.6;grid-template-columns:22px;--fader-h:150px"><div class="woa-fader__track" role="slider" aria-label="Pegel Hall-Bus"><div class="woa-fader__cap"></div></div></div><div class="woa-meter" data-ch="2" data-segs="26" data-level="0.4" style="height:150px"></div></div>
 <div class="woa-strip__name">Hall-Bus</div>
</div>
 <button class="woa-addbus" data-tip="Bus anlegen" data-kbd="Strg+Umschalt+T"><span data-woa-icon="plus" style="display:contents"></span>Bus</button>
 <div class="woa-mixsep"></div>
 <div class="woa-strip" style="--t:var(--track-6)">
 <div class="woa-keys"><button class="woa-key woa-key--sm woa-key--sq woa-key--rec" data-tip="Stumm" data-kbd="M">M</button><button class="woa-key woa-key--sm woa-key--sq woa-key--warn" data-tip="Solo" data-kbd="S">S</button><button class="woa-key woa-key--sm woa-key--sq woa-key--cue" data-woa-icon="phones" data-tip="Vorhören (PFL)"></button></div>
 <button class="woa-fx" data-tip="Effekte" data-hint="Öffnet das Insert-Rack dieser Spur">fx 2</button>
 <div class="woa-strip__fm"><div class="woa-fader" style="--v:0.75;grid-template-columns:22px;--fader-h:150px"><div class="woa-fader__track" role="slider" aria-label="Pegel Master"><div class="woa-fader__cap"></div></div></div><div class="woa-meter" data-ch="2" data-segs="26" data-level="0.8" style="height:150px"></div></div>
 <div class="woa-strip__name">Master</div>
</div>
</div>
<script>WOA.init();</script>
</body>
</html>
